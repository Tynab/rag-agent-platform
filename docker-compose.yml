name: rag-agent-platform

# ── Chính sách publish cổng ra host ───────────────────────────────────────────
# Không service nào có xác thực mặc định, nên KHÔNG publish ra mọi interface:
#   • Hạ tầng (ollama, qdrant, neo4j, rag-api, watchtower) → chỉ 127.0.0.1. Các
#     service khác gọi nhau qua network nội bộ `yan` (http://ollama:11434,
#     http://rag-api:8090, ...), cổng host chỉ phục vụ curl/runbook trên chính máy chạy.
#   • Giao diện người dùng (agent-api UI, Open WebUI) → ${BIND_ADDR:-127.0.0.1}.
#     Đặt BIND_ADDR=0.0.0.0 trong .env để mở cho LAN (khi đó cần WEBUI_AUTH=true).
#
# ── Watchtower ────────────────────────────────────────────────────────────────
# Chỉ container có label watchtower.enable=true mới được auto-update
# (WATCHTOWER_LABEL_ENABLE=true). Service giữ dữ liệu/trạng thái (ollama, qdrant,
# neo4j) đặt enable=false để không bị recreate giữa chừng một workflow đang chạy;
# rag-api/agent-api là image build local nên cũng enable=false.
#
# ── Secrets (D1b) ─────────────────────────────────────────────────────────────
# .env (được commit) chỉ chứa cấu hình KHÔNG bí mật. Mật khẩu/token nằm trong
# .env.secrets (gitignored, tạo bằng scripts/init-secrets.sh; mẫu: .env.secrets.example)
# và được nạp qua `env_file:` — KHÔNG interpolate ${...} (Compose chỉ interpolate từ .env).
# env_file dạng ngắn mặc định required (mọi bản Compose v2) → thiếu .env.secrets thì
# `docker compose up` / `config` dừng ngay với lỗi "env file .../.env.secrets not found".
# env_file nạp TOÀN BỘ key của file vào container, nên mỗi service ghi đè rỗng ("") các
# secret nó không dùng (tests/test_config_wiring.py kiểm tra):
#   neo4j      → NEO4J_AUTH                 rag-api → NEO4J_PASSWORD
#   watchtower → WATCHTOWER_HTTP_API_TOKEN
#
# ── Phiên bản image (D4a) ─────────────────────────────────────────────────────
# Image bên thứ ba dùng tag cấu hình được: <repo>:${<X>_IMAGE_TAG:-<tag cũ>}. Chưa đặt
# biến = đúng tag cũ (latest / 5-community / main). Cách pin bản đang chạy: khối
# "Phiên bản image bên thứ ba" trong .env. Image build local (rag-api, agent-api) không áp dụng.

services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    container_name: ollama
    pull_policy: if_not_present
    tty: true
    labels:
      # Stateful (model đang load, request LLM dài) — cập nhật thủ công bằng
      # `docker compose pull ollama && docker compose up -d ollama`.
      - "com.centurylinklabs.watchtower.enable=false"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_ORIGINS: ${OLLAMA_ORIGINS}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH}
      OLLAMA_FLASH_ATTENTION: "1"
    # D2: healthcheck để các service phụ thuộc chờ Ollama THỰC SỰ sẵn sàng
    # (server đã lên), thay vì chỉ chờ container start. `ollama list` nói chuyện
    # với daemon nội bộ nên xác nhận server đã phục vụ.
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # D7: GPU reservation là vô điều kiện. Trên host KHÔNG có nvidia runtime
    # (Windows/Mac dev, hoặc Linux chưa chạy setup.sh), hãy chạy kèm
    # `-f docker-compose.cpu.yml` để gỡ block deploy này, hoặc comment nó ra.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - yan
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:${QDRANT_IMAGE_TAG:-latest}
    container_name: qdrant
    labels:
      # Stateful (vector index) — không auto-recreate giữa lúc ingest/query.
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    # Image qdrant (Debian slim) không có curl/wget → kiểm tra cổng REST bằng
    # /dev/tcp của bash. Phải gọi `bash` tường minh: CMD-SHELL dùng /bin/sh (dash)
    # vốn không hỗ trợ /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yan
    restart: unless-stopped

  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:-5-community}
    container_name: neo4j
    labels:
      # Stateful (graph DB) — không auto-recreate giữa lúc ingest/query.
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    # NEO4J_AUTH=neo4j/<mật khẩu> đến từ .env.secrets — chỉ áp dụng ở lần start ĐẦU của
    # volume neo4j_data rỗng; đổi mật khẩu trên volume đã có: scripts/rotate-neo4j-password.sh.
    env_file:
      - .env.secrets
    environment:
      # PHẢI ghi đè rỗng: entrypoint của image neo4j ghi MỌI biến NEO4J_* có giá trị (trừ
      # NEO4J_AUTH, NEO4J_PLUGINS...) thành setting trong neo4j.conf → NEO4J_PASSWORD từ
      # .env.secrets sẽ thành dòng "PASSWORD=<mật khẩu>" trong neo4j.conf (lộ mật khẩu ra file
      # cấu hình). Biến rỗng thì entrypoint bỏ qua.
      NEO4J_PASSWORD: ""
      WATCHTOWER_HTTP_API_TOKEN: ""
      # D5a: KHÔNG cài plugin (NEO4J_PLUGINS) — rag-api chỉ dùng Cypher thuần (MERGE /
      # MATCH / constraint), không gọi procedure apoc.*. Bỏ APOC = không tải jar từ internet
      # mỗi lần tạo container (stack offline), start nhanh hơn, bớt bề mặt tấn công.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    # Kiểm tra cổng Bolt bằng /dev/tcp của bash (không cần curl/wget, không lộ
    # password như cypher-shell). start_period 30s cho JVM khởi động và lần start đầu
    # khởi tạo database trên volume rỗng (không còn tải plugin); retries 10 × 15s vẫn
    # chừa dư cho máy chậm trước khi bị coi là unhealthy.
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/7687"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - yan
    restart: unless-stopped

  rag-api:
    build:
      context: ./rag-api
    image: rag-agent-platform_rag-api:latest
    container_name: rag-api
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "deunhealth.restart.unhealthy=true"
    # R5a: healthcheck bằng python của image (không cần curl → Dockerfile không còn
    # apt-get). urlopen raise khi lỗi kết nối/timeout hoặc HTTP >= 400 → exit 1 = unhealthy.
    # 127.0.0.1 thay vì localhost: uvicorn chỉ nghe IPv4 (0.0.0.0).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:8090:8090"
    # NEO4J_PASSWORD đến từ .env.secrets (xem "Secrets (D1b)" ở đầu file).
    env_file:
      - .env.secrets
    environment:
      LOG_LEVEL: ${RAG_LOG_LEVEL}
      RAW_DATA_DIR: ${RAW_DATA_DIR}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      QDRANT_URL: ${QDRANT_URL}
      COLLECTION_NAME: ${COLLECTION_NAME}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      CHAT_MODEL: ${CHAT_MODEL}
      CHUNK_SIZE: ${CHUNK_SIZE}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP}
      UPSERT_BATCH_SIZE: ${UPSERT_BATCH_SIZE}
      RAG_TOP_K: ${RAG_TOP_K}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-600}
      # Ở rag-api, RAG_TIMEOUT là timeout HTTP (giây) cho mỗi lần gọi Ollama /api/embed.
      RAG_TIMEOUT: ${RAG_TIMEOUT:-600}
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_DATABASE: ${NEO4J_DATABASE}
      # Secret của service khác trong .env.secrets — không cho rag-api thấy.
      NEO4J_AUTH: ""
      WATCHTOWER_HTTP_API_TOKEN: ""
      GRAPH_ENABLED: ${GRAPH_ENABLED}
      GRAPH_ENTITY_EXTRACTION: ${GRAPH_ENTITY_EXTRACTION}
      INGEST_EMBED_WORKERS: ${INGEST_EMBED_WORKERS:-1}
      INGEST_EMBED_RETRIES: ${INGEST_EMBED_RETRIES:-3}
    volumes:
      - ./data/raw:/data/raw
    networks:
      - yan
    # D2: chờ Ollama + Qdrant healthy trước khi rag-api khởi động (Qdrant là bắt buộc
    # cho mọi /ingest và /ask). Neo4j CỐ Ý chỉ service_started: graph là tùy chọn
    # (GRAPH_ENABLED=false thì không dùng), rag-api degrade graceful khi Neo4j chưa
    # sẵn sàng, và Neo4j (JVM) khởi động chậm hơn các service khác — không nên chặn
    # cả stack vì nó.
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_started
    restart: unless-stopped

  agent-api:
    build:
      context: ./agent-api
    image: rag-agent-platform_agent-api:latest
    container_name: agent-api
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "deunhealth.restart.unhealthy=true"
    # R5a: như rag-api — healthcheck bằng python, image không cài curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8091:8091"
    environment:
      LOG_LEVEL: ${RAG_LOG_LEVEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      RAG_API_URL: ${RAG_API_URL}
      RAG_TOP_K: ${RAG_TOP_K}
      RAG_TIMEOUT: ${RAG_TIMEOUT:-600}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-1200}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      CODING_PLANNER_MODEL: ${CODING_PLANNER_MODEL}
      BA_MODEL: ${BA_MODEL}
      PM_MODEL: ${PM_MODEL}
      SA_MODEL: ${SA_MODEL}
      TA_MODEL: ${TA_MODEL}
      DESIGNER_MODEL: ${DESIGNER_MODEL}
      FE_MODEL: ${FE_MODEL}
      MOBILE_MODEL: ${MOBILE_MODEL}
      DBA_MODEL: ${DBA_MODEL}
      DA_MODEL: ${DA_MODEL}
      BE_MODEL: ${BE_MODEL}
      TECH_LEAD_MODEL: ${TECH_LEAD_MODEL}
      TL_MODEL: ${TL_MODEL}
      TESTER_MODEL: ${TESTER_MODEL}
      DEVSECOPS_MODEL: ${DEVSECOPS_MODEL}
      CLARIFIER_MODEL: ${CLARIFIER_MODEL}
      CLARIFIER_REGEN_LOOPS: ${CLARIFIER_REGEN_LOOPS:-1}
      MEMORY_DIR: /data/memory
      ARTIFACT_DIR: /data/artifacts
      MAX_FILES_PER_ROLE: ${MAX_FILES_PER_ROLE:-6}
      # Ngân sách thời gian tổng của một workflow (giây). 0 = không giới hạn.
      WORKFLOW_MAX_SECONDS: ${WORKFLOW_MAX_SECONDS:-0}
      # Số workflow chạy đồng thời. Giữ 1 vì Ollama phục vụ tuần tự (NUM_PARALLEL=1).
      WORKFLOW_CONCURRENCY: ${WORKFLOW_CONCURRENCY:-1}
      # SQLite lưu trạng thái workflow — nằm trong volume ./data/memory để sống sót restart.
      WORKFLOW_DB_PATH: ${WORKFLOW_DB_PATH:-/data/memory/workflows.sqlite3}
      # Trần token sinh ra (num_predict) cho planner JSON / mỗi file code / báo cáo Markdown.
      PLANNER_NUM_PREDICT: ${PLANNER_NUM_PREDICT:-2048}
      FILEGEN_NUM_PREDICT: ${FILEGEN_NUM_PREDICT:-8192}
      REPORT_NUM_PREDICT: ${REPORT_NUM_PREDICT:-16384}
      # Bật/tắt "thinking" khi sinh file (true/false). Rỗng = theo mặc định của model.
      FILEGEN_THINK: ${FILEGEN_THINK:-}
    volumes:
      - ./data/memory:/data/memory
      - ./data/artifacts:/data/artifacts
    networks:
      - yan
    # D2: agent-api cần rag-api healthy (mọi node gọi /retrieve) và Ollama healthy.
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rag-api:
        condition: service_healthy
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_IMAGE_TAG:-main}
    container_name: open-webui
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${OPEN_WEBUI_PORT}:${OPEN_WEBUI_PORT}"
    volumes:
      - open-webui:/app/backend/data
      - ./data/raw:/data/raw
    environment:
      PORT: ${OPEN_WEBUI_PORT}
      WEBUI_AUTH: ${WEBUI_AUTH}
      WEBUI_NAME: ${WEBUI_NAME}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      VECTOR_DB: ${VECTOR_DB}
      QDRANT_URI: ${QDRANT_URL}
      QDRANT_PREFER_GRPC: ${QDRANT_PREFER_GRPC}
      ENABLE_QDRANT_MULTITENANCY_MODE: ${ENABLE_QDRANT_MULTITENANCY_MODE}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX}
      RAG_EMBEDDING_ENGINE: ${RAG_EMBEDDING_ENGINE}
      RAG_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      RAG_EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      RAG_TOP_K: ${RAG_TOP_K}
      USER_AGENT: "rag-agent-platform/1.0"
      # Bật WebSocket (Socket.IO) tường minh để câu trả lời stream real-time về browser
      # (không phải F5 mới thấy). Mặc định đã true nhưng set rõ cho chắc.
      ENABLE_WEBSOCKET_SUPPORT: "true"
      # DEV: "*" để loại trừ nguyên nhân CORS chặn WebSocket handshake. Khi deploy thật,
      # đổi lại allowlist cụ thể (giá trị cũ):
      # "http://18.191.161.84:8085,http://localhost:8085,http://127.0.0.1:8085"
      CORS_ALLOW_ORIGIN: "*"
    networks:
      - yan
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # Open WebUI và các tool (Valves) gọi ollama/rag-api/agent-api qua network `yan`
    # (http://<service>:<port>), KHÔNG qua host.docker.internal. Lưu ý: từ container,
    # host.docker.internal không tới được các cổng host chỉ bind 127.0.0.1.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:${WATCHTOWER_IMAGE_TAG:-latest}
    container_name: watchtower
    # D5: publish HTTP API ra localhost để runbook trong README (localhost:8080/v1/*)
    # chạy được. Chỉ bind 127.0.0.1 — không expose ra ngoài host.
    ports:
      - "127.0.0.1:8080:8080"
    # D4: watchtower CẦN quyền ghi docker.sock để pull + recreate container nên không
    # thể mount :ro. Đánh đổi: compromise image này = quyền root trên host. Muốn giảm
    # blast radius thật sự thì dùng docker-socket-proxy (chỉ mở endpoint cần thiết).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # WATCHTOWER_HTTP_API_TOKEN đến từ .env.secrets (xem "Secrets (D1b)" ở đầu file).
    env_file:
      - .env.secrets
    environment:
      DOCKER_API_VERSION: "1.44"
      # TZ quyết định múi giờ của WATCHTOWER_SCHEDULE. Thiếu TZ thì cron chạy theo UTC
      # (0 0 4 * * * = 11:00 Asia/Ho_Chi_Minh thay vì 04:00).
      TZ: ${TZ}
      WATCHTOWER_CLEANUP: ${WATCHTOWER_CLEANUP}
      WATCHTOWER_INCLUDE_STOPPED: ${WATCHTOWER_INCLUDE_STOPPED}
      WATCHTOWER_TIMEOUT: ${WATCHTOWER_TIMEOUT}
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE}
      WATCHTOWER_HTTP_API_METRICS: ${WATCHTOWER_HTTP_API_METRICS}
      # Chỉ cập nhật container có label watchtower.enable=true (open-webui, deunhealth).
      WATCHTOWER_LABEL_ENABLE: "true"
      # Secret của service khác trong .env.secrets. (Watchtower có docker.sock nên vẫn đọc
      # được env của mọi container — ghi đè rỗng chỉ để giữ quy tắc "mỗi service một secret".)
      NEO4J_PASSWORD: ""
      NEO4J_AUTH: ""
    networks:
      - yan
    restart: unless-stopped

  deunhealth:
    image: qmcgaw/deunhealth:${DEUNHEALTH_IMAGE_TAG:-latest}
    container_name: deunhealth
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # D4: deunhealth cũng cần ghi docker.sock để restart container unhealthy → cùng
    # rủi ro root-on-host như watchtower. Cân nhắc socket-proxy nếu môi trường nhạy cảm.
    # Không publish cổng: HEALTH_SERVER_ADDRESS (127.0.0.1:9999) chỉ phục vụ healthcheck
    # nội bộ của chính image, và network_mode: none thì publish cổng cũng vô nghĩa.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LOG_LEVEL: ${DEUNHEALTH_LOG_LEVEL}
      HEALTH_SERVER_ADDRESS: ${HEALTH_SERVER_ADDRESS}
      TZ: ${TZ}
    network_mode: none
    restart: unless-stopped

volumes:
  ollama:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
  open-webui:

networks:
  yan:
    driver: bridge
