name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy==2.4.1

      - name: Install service deps (cho test ingest/workflow)
        run: |
          pip install -r rag-api/requirements.txt
          pip install -r agent-api/requirements.txt

      - name: Lint (ruff)
        run: ruff check rag-api agent-api open-webui-tools tests

      # agent-api/app.py và rag-api/app.py trùng tên module "app" → chạy mypy riêng từng
      # thư mục service (cấu hình [tool.mypy] trong pyproject.toml). Chạy đủ cả 3 thư mục
      # rồi mới báo lỗi để thấy hết vấn đề trong một lần.
      - name: Type check (mypy)
        run: |
          status=0
          for d in agent-api rag-api open-webui-tools; do
            echo "::group::mypy $d"
            (cd "$d" && python -m mypy --config-file ../pyproject.toml *.py) || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Unit tests (pytest)
        run: pytest -q
