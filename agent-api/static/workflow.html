<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rag-agent-platform · Workflow UI</title>
  <!-- Thư viện vendor đi kèm repo (agent-api/static/vendor/, phiên bản ghi trong tên file)
       → chạy offline hoàn toàn, không phụ thuộc CDN. Giữ thẻ script đồng bộ (không defer/async):
       script inline bên dưới cần marked/DOMPurify sẵn sàng. JSZip nạp lười khi bấm Download All.
       highlight-11.12.0-<lang>.min.js: grammar lẻ của @highlightjs/cdn-assets@11.12.0 cho các ngôn
       ngữ artifact mà bản common không có (Dockerfile, nginx, Dart, Groovy, .properties) — tự
       đăng ký vào hljs nên phải nạp SAU highlight-11.12.0.min.js. -->
  <script src="/ui/static/vendor/marked-11.2.0.min.js"></script>
  <script src="/ui/static/vendor/dompurify-3.4.17.min.js"></script>
  <link rel="stylesheet" href="/ui/static/vendor/highlight-11.12.0-github-dark.min.css">
  <script src="/ui/static/vendor/highlight-11.12.0.min.js"></script>
  <script src="/ui/static/vendor/highlight-11.12.0-dockerfile.min.js"></script>
  <script src="/ui/static/vendor/highlight-11.12.0-nginx.min.js"></script>
  <script src="/ui/static/vendor/highlight-11.12.0-dart.min.js"></script>
  <script src="/ui/static/vendor/highlight-11.12.0-groovy.min.js"></script>
  <script src="/ui/static/vendor/highlight-11.12.0-properties.min.js"></script>
  <style>
    /* ── Reset & tokens ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #21262d;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --accent:    #6366f1;
      --accent-l:  #818cf8;
      --ok:        #22c55e;
      --warn:      #f59e0b;
      --err:       #ef4444;
      --run:       #3b82f6;
      --radius:    10px;
      /* Chiều cao thật của header sticky — trackHeaderHeight() cập nhật (≤640px header gập
         2 hàng). Thanh tab dính ngay dưới header dùng giá trị này. */
      --header-h:  56px;
    }

    html {
      font-size: 14px;
      /* Cuộn tới anchor / scrollIntoView không bị header + thanh tab sticky che mất */
      scroll-padding-top: calc(var(--header-h) + 48px);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ──────────────────────────────────────────────── */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(13,17,23,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
      color: var(--text);
    }
    .logo em { color: var(--accent-l); font-style: normal; }

    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      max-width: 560px;
    }

    .search-row input {
      flex: 1;
      min-width: 0; /* cho phép co dưới độ rộng mặc định của <input> trên màn hẹp */
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      outline: none;
      transition: border-color .2s;
    }
    .search-row input:focus { border-color: var(--accent); }
    .search-row input::placeholder { color: var(--muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border: none;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    .btn:hover  { opacity: .85; }
    .btn:active { transform: scale(.97); }
    .btn:disabled, .btn:disabled:hover { opacity: .55; cursor: not-allowed; }
    .btn:disabled:active { transform: none; }
    .btn-primary   { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    .btn-danger    { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.45); color: var(--err); }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    /* Viền focus rõ ràng khi dùng bàn phím (:focus-visible — click chuột không hiện viền) */
    .btn:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent-l);
      outline-offset: 2px;
    }

    .poll-indicator {
      font-size: 11px;
      color: var(--run);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
      white-space: nowrap;
    }
    .blink-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--run);
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
    /* Poll lỗi tạm thời (5xx / mất mạng) → chấm chuyển vàng, chữ "Mất kết nối…" (header sticky
       nên luôn thấy, kể cả khi đang cuộn đọc output dài) */
    .poll-indicator.retry { color: var(--warn); }
    .poll-indicator.retry .blink-dot { background: var(--warn); }

    /* ── Main layout ─────────────────────────────────────────── */
    .main {
      padding: 24px;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ── Empty / error state ────────────────────────────────── */
    .center-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 96px 24px;
      text-align: center;
      gap: 12px;
    }
    .center-state .icon { font-size: 60px; }
    .center-state h2 { font-size: 20px; font-weight: 700; }
    .center-state p  { color: var(--muted); max-width: 420px; font-size: 13px; }

    .err-box {
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.35);
      border-radius: var(--radius);
      padding: 12px 16px;
      color: var(--err);
      font-size: 13px;
      max-width: 600px;
      margin: 40px auto;
    }

    /* ── Recent list ─────────────────────────────────────────── */
    .recent-section { margin-bottom: 24px; }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .recent-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .recent-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .recent-chip:hover { border-color: var(--accent); }
    .recent-chip .rc-id { font-family: monospace; font-size: 12px; color: var(--accent-l); }
    .recent-chip .rc-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ── Workflow view ───────────────────────────────────────── */
    .wf-view { display: none; }
    /* trackWorkflow() → lần render thành công đầu tiên: ẩn các khung build-once (chúng còn
       giữ dữ liệu của workflow theo dõi trước) — nếu không, lỗi mạng ở lần tải đầu sẽ để
       lại badge/bước/output của workflow cũ dưới ID mới. */
    .wf-view .wf-load-state { display: none; }
    .wf-view.wf-loading .wf-load-state { display: flex; }
    .wf-view.wf-loading .status-bar,
    .wf-view.wf-loading .progress-card,
    .wf-view.wf-loading .content-card { display: none; }

    /* Status bar */
    .status-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .badge-pending   { background: rgba(245,158,11,.15);  color: var(--warn); }
    .badge-running   { background: rgba(59,130,246,.15);  color: var(--run); }
    .badge-completed { background: rgba(34,197,94,.15);   color: var(--ok); }
    .badge-failed    { background: rgba(239,68,68,.15);   color: var(--err); }
    .badge-cancelled { background: rgba(139,148,158,.15); color: var(--muted); }

    .status-meta { display: flex; gap: 24px; flex-wrap: wrap; flex: 1; }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-item .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .meta-item .val { font-size: 13px; font-weight: 600; }
    .meta-item .meta-failed { color: var(--err); }

    .status-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    /* Dòng ghi chú trạng thái (vị trí hàng đợi / đang hủy) — chiếm nguyên một hàng của status bar */
    .status-note { flex: 1 1 100%; font-size: 12px; font-weight: 600; color: var(--warn); }

    /* Banner mất kết nối: giữ dữ liệu lần cập nhật cuối, thử lại với backoff */
    .conn-banner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      background: rgba(245,158,11,.08);
      border: 1px solid rgba(245,158,11,.35);
      border-radius: var(--radius);
      padding: 8px 14px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--warn);
    }
    .conn-banner .cb-text { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }

    /* ── Progress tracker ────────────────────────────────────── */
    .progress-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .progress-head .section-label { margin-bottom: 0; }
    .progress-count { font-size: 13px; color: var(--muted); }
    .progress-count strong { color: var(--text); font-size: 18px; }

    .steps-track {
      display: flex;
      align-items: flex-start;
      overflow-x: auto;
      /* overflow-x:auto buộc overflow-y cũng clip → box-shadow ring của step-circle
         (.selected 3px, .active pulse tới 9px) bị cắt ở mép trên/dưới. Thêm padding
         dọc để ring có chỗ hiển thị đầy đủ. */
      padding: 12px 2px 10px;
    }

    .step-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 72px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .step-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      transition: all .25s;
      position: relative;
      z-index: 1;
    }
    .step-circle svg { width: 18px; height: 18px; stroke-width: 2.5; }

    .step-node.done  .step-circle {
      background: rgba(34,197,94,.12);
      border-color: var(--ok);
      color: var(--ok);
    }
    .step-node.active .step-circle {
      background: rgba(59,130,246,.12);
      border-color: var(--run);
      color: var(--run);
      animation: ring-pulse 1.6s ease-in-out infinite;
    }
    /* Bước lỗi (output "[LỖI …]") — đỏ ✗ thay vì ✓ xanh; bước có file sinh lỗi — ✓ vàng */
    .step-node.failed .step-circle {
      background: rgba(239,68,68,.12);
      border-color: var(--err);
      color: var(--err);
    }
    .step-node.warn .step-circle {
      background: rgba(245,158,11,.12);
      border-color: var(--warn);
      color: var(--warn);
    }
    .step-node.selected .step-circle {
      box-shadow: 0 0 0 3px rgba(99,102,241,.45);
    }
    @keyframes ring-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(59,130,246,.5); }
      60%      { box-shadow: 0 0 0 9px rgba(59,130,246,.0); }
    }

    .step-label {
      font-size: 10px;
      font-weight: 600;
      margin-top: 7px;
      color: var(--muted);
      text-align: center;
      white-space: nowrap;
    }
    .step-sublabel {
      font-size: 9px;
      color: var(--muted);
      text-align: center;
      opacity: .65;
      white-space: nowrap;
      max-width: 68px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .step-node.done  .step-label { color: var(--ok); }
    .step-node.active .step-label { color: var(--run); }
    .step-node.failed .step-label { color: var(--err); }
    .step-node.warn  .step-label { color: var(--warn); }

    .step-connector {
      flex: 1;
      min-width: 6px;
      height: 2px;
      background: var(--border);
      margin-top: 19px; /* center on 40px circle */
      flex-shrink: 1;
      transition: background .4s;
    }
    .step-connector.done   { background: var(--ok); }
    .step-connector.active { background: linear-gradient(90deg, var(--ok), var(--run)); }

    /* ── Content card ────────────────────────────────────────── */
    .content-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      /* clip (không phải hidden): overflow:hidden biến card thành scroll container nên
         position:sticky của thanh tab bên trong không bao giờ dính. hidden là đường lui cho
         trình duyệt cũ không hiểu clip (tab chỉ không dính, không vỡ gì). */
      overflow: hidden;
      overflow: clip;
    }

    /* Tabs — dính ngay dưới header khi cuộn output dài (đổi tab không phải cuộn ngược lên).
       z-index: trên ô tiêu đề bảng / nút copy trong tab-body, dưới header (50). */
    .tabs-nav {
      display: flex;
      overflow-x: auto;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: var(--header-h);
      z-index: 20;
    }
    .tabs-nav::-webkit-scrollbar { height: 3px; }
    .tabs-nav::-webkit-scrollbar-thumb { background: var(--border); }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 14px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s;
    }
    .tab-btn:hover   { color: var(--text); }
    /* outline vẽ vào trong: .tabs-nav cuộn ngang nên viền ngoài bị cắt */
    .tab-btn:focus-visible, .sub-tab-btn:focus-visible { outline: 2px solid var(--accent-l); outline-offset: -2px; }
    .tab-btn.active  { color: var(--accent-l); border-bottom-color: var(--accent); }
    .tab-btn.t-done  { color: var(--ok); }
    .tab-btn.t-run   { color: var(--run); }
    .tab-btn.t-done.active, .tab-btn.t-run.active { color: var(--accent-l); }
    .tab-btn.t-fail  { color: var(--err); }
    .tab-btn.t-warn  { color: var(--warn); }
    .tab-btn.t-fail.active, .tab-btn.t-warn.active { color: var(--accent-l); }
    /* Icon ✗ / ⚠ giữ màu cả khi tab đang được chọn (chữ tab chuyển màu accent) */
    .tab-btn.t-fail .tab-icon { color: var(--err); }
    .tab-btn.t-warn .tab-icon { color: var(--warn); }

    .tab-icon { font-size: 13px; }

    /* Thông báo đầu tab-body: bước lỗi (đỏ) / một số file sinh lỗi (vàng) */
    .step-notice {
      border: 1px solid;
      border-radius: var(--radius);
      padding: 10px 14px;
      margin-bottom: 18px;
      font-size: 12.5px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .step-notice strong { display: block; font-size: 13px; margin-bottom: 2px; }
    .step-notice-err  { background: rgba(239,68,68,.08);  border-color: rgba(239,68,68,.35);  color: #fca5a5; }
    .step-notice-err strong  { color: var(--err); }
    .step-notice-warn { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.35); color: #fcd34d; }
    .step-notice-warn strong { color: var(--warn); }

    /* Content area */
    .tab-body {
      padding: 28px;
      min-height: 420px;
    }

    /* Loading / waiting states */
    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 80px 24px;
      text-align: center;
      color: var(--muted);
    }
    .state-box .big-icon { font-size: 44px; }
    .state-box h3 { font-size: 15px; font-weight: 700; color: var(--text); }
    .state-box p  { font-size: 12px; max-width: 320px; }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid var(--surface2);
      border-top-color: var(--run);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Markdown render ─────────────────────────────────────── */
    .md {
      font-size: 13.5px;
      line-height: 1.8;
      color: var(--text);
      /* URL / inline code dài không có khoảng trắng → xuống dòng thay vì bị
         .content-card (overflow:hidden) cắt mất trên màn hẹp. Không ảnh hưởng <pre>
         (white-space: pre) và bảng (th/td tự xuống dòng trong min/max-width, .table-wrap cuộn ngang). */
      overflow-wrap: break-word;
    }
    .md h1,.md h2,.md h3,.md h4,.md h5 {
      color: var(--text);
      font-weight: 700;
      margin: 1.5em 0 .6em;
    }
    .md h1 { font-size: 1.55em; border-bottom: 1px solid var(--border); padding-bottom: .35em; }
    .md h2 { font-size: 1.25em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
    .md h3 { font-size: 1.1em; }
    .md p  { margin: .75em 0; }
    .md ul,.md ol { margin: .75em 0 .75em 1.6em; }
    .md li { margin: .3em 0; }
    .md strong { font-weight: 700; color: #f0f6fc; }
    .md em { font-style: italic; color: #cdd9e5; }
    .md a  { color: var(--accent-l); text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
    .md blockquote {
      border-left: 3px solid var(--accent);
      padding: .5em 1em;
      margin: 1em 0;
      background: var(--surface2);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--muted);
    }
    .md code {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 5px;
      font-family: 'SF Mono','Fira Code','Cascadia Code',monospace;
      font-size: .9em;
      color: var(--accent-l);
    }
    .md pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      overflow-x: auto;
      margin: 1em 0;
      /* Explicit monospace stack — Consolas/Cascadia best for box-drawing on Windows */
      font-family: 'Cascadia Code','Cascadia Mono','Consolas','Fira Code','SF Mono','DejaVu Sans Mono','Courier New',monospace;
      font-size: 12.5px;
      line-height: 1.45;           /* tighter for diagram alignment */
      font-variant-ligatures: none; /* prevent |> → ⇒ substitutions that shift widths */
      tab-size: 4;
    }
    .md pre code { background: none; border: none; padding: 0; color: var(--text); font-size: 1em;
      font-family: inherit; /* keep the same stack — don't inherit from .md code */ }
    /* Bảng: ô được xuống dòng — trước đây th/td nowrap + width:max-content làm bảng yêu cầu
       rộng ~2× màn hình. Bảng vừa khung (width 100%); chỉ khi tổng độ rộng tối thiểu của các
       cột (mỗi cột 8em–40em, hàng tiêu đề + cột đầu NGẮN giữ một dòng) vượt khung thì
       .table-wrap mới cuộn ngang. Bảng cao bị giới hạn 70vh, cuộn dọc bên trong với hàng tiêu
       đề dính trên. */
    .md .table-wrap { overflow: auto; width: 100%; max-height: 70vh; margin: 1em 0;
      /* thin custom scrollbar */
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .md .table-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
    .md .table-wrap::-webkit-scrollbar-track { background: transparent; }
    .md .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    /* separate (không collapse): với border-collapse, viền của ô sticky ở lại chỗ cũ khi cuộn.
       Viền vẽ ở cạnh phải/dưới của từng ô + cạnh trái của bảng + cạnh trên của hàng tiêu đề. */
    .md table { border-collapse: separate; border-spacing: 0; width: 100%; margin: 0;
                border-left: 1px solid var(--border); }
    .md th, .md td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 7px 12px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
      min-width: 8em;
      max-width: 40em;
      overflow-wrap: break-word; /* giữ nguyên từ; URL / định danh dài bị ngắt khi chạm max-width */
    }
    .md th {
      background: var(--surface2);
      font-weight: 700;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .md thead tr:first-child > * { border-top: 1px solid var(--border); }
    /* Cột đầu một dòng chỉ khi mọi ô của nó ngắn (ID, tên ngắn — renderTabBody gắn class qua
       shortFirstColumn); cột đầu là câu dài thì xuống dòng như các cột khác. */
    .md table.first-col-nowrap td:first-child { white-space: nowrap; }
    .md tr:nth-child(even) { background: rgba(255,255,255,.02); }

    /* ── Toast ───────────────────────────────────────────────── */
    /* Ngăn xếp toast cố định góc dưới phải (toast mới nằm dưới cùng). #toast-stack có sẵn
       trong HTML với role="status" — vùng live phải tồn tại TRƯỚC khi chèn nội dung thì
       trình đọc màn hình mới đọc. pointer-events: none để không chặn click vào trang. */
    .toast-stack {
      position: fixed;
      right: 24px; bottom: 24px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      max-width: min(420px, calc(100vw - 48px));
      pointer-events: none;
    }
    .toast {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 10px 16px;
      border-radius: var(--radius);
      font-size: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
      overflow-wrap: anywhere;
      animation: slide-up .25s ease;
    }
    .toast-ok   { border-left-color: var(--ok); }
    .toast-warn { border-left-color: var(--warn); }
    .toast-err  { border-left-color: var(--err); }
    @keyframes slide-up {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ── Scrollbar ───────────────────────────────────────────── */
    ::-webkit-scrollbar       { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ── Sub-tabs (Output / Files) ───────────────────────────── */
    .sub-tab-row {
      display: flex; gap: 4px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
    }
    .sub-tab-btn {
      background: none; border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 6px 14px;
      font-size: 12px; font-weight: 600;
      color: var(--muted); cursor: pointer;
      transition: color .15s;
    }
    .sub-tab-btn:hover { color: var(--text); }
    .sub-tab-btn.active { color: var(--accent-l); border-bottom-color: var(--accent); }
    .art-count {
      background: var(--accent); color: #fff;
      font-size: 10px; padding: 1px 5px;
      border-radius: 99px; margin-left: 4px;
    }

    /* ── File tree ───────────────────────────────────────────── */
    .art-header {
      display: flex; justify-content: flex-end; margin-bottom: 12px;
    }
    .file-tree {
      border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; margin-bottom: 16px;
    }
    .ft-dir-label {
      display: block; padding: 6px 14px;
      font-size: 11px; font-weight: 700; color: var(--muted);
      background: rgba(255,255,255,.02); letter-spacing: .04em;
      border-top: 1px solid var(--border);
    }
    .ft-dir-label:first-child { border-top: none; }
    .ft-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 14px 7px 28px; cursor: pointer;
      transition: background .12s; border-top: 1px solid var(--border);
    }
    .ft-item:hover { background: var(--surface2); }
    .ft-icon  { font-size: 14px; flex-shrink: 0; }
    /* min-width:0 + overflow-wrap: tên file dài xuống dòng thay vì đẩy size / nút ⬇
       ra ngoài khung (bị cắt) trên màn hẹp */
    .ft-name  { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 12px; font-family: 'SF Mono','Fira Code',monospace; color: var(--text); }
    .ft-size  { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .ft-dl    { margin-left: 6px; opacity: 0; transition: opacity .15s; text-decoration: none; flex-shrink: 0; }
    /* Hiện nút ⬇ khi hover, khi focus bằng bàn phím, và luôn hiện trên thiết bị
       không có hover (cảm ứng) — trước đây opacity:0 nên trên điện thoại không thấy */
    .ft-item:hover .ft-dl, .ft-item:focus-within .ft-dl { opacity: 1; }
    @media (hover: none) { .ft-dl { opacity: 1; } }

    /* ── File content viewer ──────────────────────────────────── */
    .art-viewer {
      border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; margin-top: 14px;
    }
    .art-viewer-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      background: var(--surface2); border-bottom: 1px solid var(--border);
    }
    .art-viewer-path {
      flex: 1; font-size: 12px;
      font-family: 'SF Mono','Fira Code',monospace;
      color: var(--accent-l);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .art-viewer-body {
      margin: 0; padding: 16px; overflow-x: auto;
      background: var(--surface); font-size: 12px; line-height: 1.6;
      max-height: 520px; overflow-y: auto;
    }
    /* Override hljs background to match theme */
    .hljs { background: var(--surface) !important; }
    /* highlight.js chỉ tô màu chữ; nền/padding/cuộn do <pre> bọc ngoài quyết định. Theme
       cho code.hljs display:block + padding 1em + overflow riêng → hộp lồng hộp trong
       .md pre và thanh cuộn ngang lồng trong khung cuộn của <pre>. */
    .md pre code.hljs, .art-viewer-body code.hljs {
      display: inline; padding: 0; overflow: visible; background: transparent !important;
    }
    /* Markdown code blocks: scrollable, not overflowing */
    .md pre { max-height: 520px; overflow-y: auto; overflow-x: auto;
              border-radius: 6px; margin: 8px 0;
              scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .md pre::-webkit-scrollbar { width: 5px; height: 5px; }
    .md pre::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .md pre code { font-size: 12.5px; line-height: 1.45; }
    .md code { font-size: 12px; }
    /* Khối code trong output: nút Copy ở góc trên phải, đặt NGOÀI <pre> (pre tự cuộn ngang/dọc
       — nút nằm trong sẽ trôi theo nội dung). Mờ khi không dùng; rõ khi hover / focus bàn phím,
       luôn rõ trên màn cảm ứng. z-index dưới thanh tab sticky (20). */
    .md .code-wrap { position: relative; margin: 8px 0; }
    .md .code-wrap > pre { margin: 0; }
    .code-copy {
      position: absolute;
      top: 6px; right: 12px;
      z-index: 2;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      opacity: .6;
      transition: opacity .15s, color .15s;
    }
    .code-wrap:hover .code-copy, .code-copy:focus-visible { opacity: 1; color: var(--text); }
    .code-copy:focus-visible { outline: 2px solid var(--accent-l); outline-offset: 2px; }
    @media (hover: none) { .code-copy { opacity: 1; } }
    /* Đường lui khi không render được markdown (renderMarkdown): text thô xuống dòng như
       văn bản — không thành hộp 520px cuộn ngang/dọc trên màn hẹp. */
    .md pre.md-fallback { white-space: pre-wrap; overflow-wrap: anywhere; max-height: none; overflow: visible; }
    .md .md-fallback-note { margin: 0 0 .5em; color: var(--warn); font-size: 12px; }

    /* ── Responsive ──────────────────────────────────────────── */
    /* Đặt cuối <style> để thắng các rule cùng độ ưu tiên ở trên. Mục tiêu: không có
       cuộn ngang cả trang ở 360px; các dải dài (steps-track, tabs-nav, bảng, <pre>)
       tự cuộn ngang bên trong khung của chúng. */
    @media (max-width: 768px) {
      .header       { padding: 0 16px; gap: 12px; }
      .main         { padding: 16px; }
      .status-bar   { padding: 14px 16px; gap: 12px 20px; }
      .status-meta  { gap: 10px 20px; }
      .progress-card { padding: 16px; }
      .progress-head { margin-bottom: 12px; }
      .tab-body     { padding: 20px 16px; min-height: 320px; }
    }
    @media (max-width: 640px) {
      /* Header gập 2 hàng: [logo … Polling · Copy ID] / [ô Workflow ID · Track · Recent].
         Một hàng 56px cố định + nowrap trước đây tràn ra ngoài và đè lên nhau. */
      .header     { height: auto; min-height: 56px; flex-wrap: wrap; row-gap: 8px; padding-top: 10px; padding-bottom: 10px; }
      .logo       { flex: 1 1 0; min-width: 0; max-width: none; }  /* co + ellipsis thay vì đẩy sang hàng thứ 3 */
      .search-row { order: 1; flex: 1 1 100%; max-width: none; }
      /* Có nút hủy: [badge … nút hủy] / [meta cả hàng] / [ghi chú] — nếu không, meta bị ép
         thành một cột hẹp giữa badge và nút, mỗi mục một dòng */
      .status-bar.has-actions .status-actions { order: 1; }
      .status-bar.has-actions .status-meta    { order: 2; flex-basis: 100%; }
      .status-bar.has-actions .status-note    { order: 3; }
    }
    @media (max-width: 480px) {
      .header       { padding-left: 12px; padding-right: 12px; column-gap: 8px; }
      .poll-text    { display: none; }   /* chỉ giữ chấm nhấp nháy — badge Running bên dưới đã nói rõ */
      .main         { padding: 12px; }
      .center-state { padding: 56px 12px; }
      .status-bar   { padding: 12px; }
      .progress-card { padding: 14px 12px; }
      .progress-head { flex-wrap: wrap; gap: 4px 12px; }
      .tab-body     { padding: 16px 12px; }
      .ft-item      { padding-left: 16px; padding-right: 10px; }
      .md th, .md td { min-width: 7em; padding: 6px 8px; }   /* bảng 3 cột vừa khung 360px */
      .toast-stack  { left: 12px; right: 12px; bottom: 12px; max-width: none; align-items: stretch; }
    }

    /* ── Giảm chuyển động ────────────────────────────────────── */
    /* prefers-reduced-motion: tắt các animation lặp (ring-pulse, blink, spin) và
       transition. !important để thắng cả animation khai báo inline (icon loader). */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

<!-- ── HEADER ────────────────────────────────────────────────────────── -->
<header class="header" id="app-header">
  <div class="logo">rag-agent-platform <em>SDLC</em></div>

  <div class="search-row">
    <input id="wid-input" type="text" placeholder="Nhập Workflow ID…" spellcheck="false" />
    <button class="btn btn-primary" onclick="trackFromInput()">Track</button>
    <button class="btn btn-secondary" onclick="showRecent()">Recent</button>
  </div>

  <div id="poll-indicator" class="poll-indicator" style="display:none">
    <span class="blink-dot"></span><span class="poll-text" id="poll-text">Polling…</span>
  </div>
  <button id="copy-btn" class="btn btn-secondary btn-sm" style="display:none" onclick="copyId()">Copy ID</button>
</header>

<!-- ── MAIN ──────────────────────────────────────────────────────────── -->
<main class="main">

  <!-- Empty state -->
  <div id="empty-state" class="center-state">
    <div class="icon">🤖</div>
    <h2>Workflow SDLC của rag-agent-platform</h2>
    <p>Nhập Workflow ID để theo dõi tiến trình 15 bước, hoặc nhấn <strong>Recent</strong> để xem các lần chạy gần đây.</p>
  </div>

  <!-- Error box -->
  <div id="err-box" class="err-box" style="display:none"></div>

  <!-- Recent list -->
  <div id="recent-section" class="recent-section" style="display:none">
    <div class="section-label">Workflows gần đây</div>
    <div id="recent-grid" class="recent-grid"></div>
  </div>

  <!-- ── Workflow view ─────────────────────────────────────────────── -->
  <div id="wf-view" class="wf-view">

    <!-- Banner mất kết nối — onPollFailure() bật khi poll lỗi tạm thời (5xx / mạng), dữ liệu
         lần cập nhật cuối vẫn hiển thị bên dưới; poll thành công thì tự ẩn -->
    <div id="conn-banner" class="conn-banner" role="status" style="display:none">
      <span class="cb-text" id="conn-banner-text"></span>
      <button class="btn btn-secondary btn-sm" onclick="pollNow()">Thử lại ngay</button>
    </div>

    <!-- Chưa tải được dữ liệu của workflow đang theo dõi (class wf-loading trên #wf-view) -->
    <div class="state-box wf-load-state">
      <div class="spinner"></div>
      <p>Đang tải workflow…</p>
    </div>

    <!-- Status bar — khung tĩnh, renderStatusBar() chỉ cập nhật class/text tại chỗ -->
    <div class="status-bar" id="status-bar">
      <div id="status-badge">
        <span class="badge badge-pending" id="status-pill"><span class="blink-dot" id="status-dot"></span><span id="status-label">…</span></span>
      </div>
      <div class="status-meta" id="status-meta">
        <div class="meta-item">
          <span class="lbl">Project</span>
          <span class="val" id="meta-project">—</span>
        </div>
        <div class="meta-item">
          <span class="lbl">Started</span>
          <span class="val" id="meta-started">—</span>
        </div>
        <div class="meta-item">
          <span class="lbl">Duration</span>
          <span class="val" id="dur-val">—</span>
        </div>
        <div class="meta-item">
          <span class="lbl">Steps</span>
          <span class="val"><span id="meta-steps">—</span><span class="meta-failed" id="meta-steps-failed"></span></span>
        </div>
        <div class="meta-item" id="meta-error" style="flex:1 1 100%; display:none">
          <span class="lbl">Error</span>
          <span class="val" id="meta-error-val" style="color:var(--err); font-size:12px"></span>
        </div>
      </div>
      <!-- Nút hủy: chỉ hiện khi pending/running (renderCancelUi) -->
      <div class="status-actions">
        <button id="cancel-btn" class="btn btn-danger btn-sm" style="display:none" onclick="requestCancel()">✕ Hủy workflow</button>
      </div>
      <div class="status-note" id="status-note" role="status" style="display:none"></div>
    </div>

    <!-- Progress tracker -->
    <div class="progress-card">
      <div class="progress-head">
        <span class="section-label">15-Step SDLC Pipeline</span>
        <span class="progress-count"><strong id="steps-done">0</strong> / 15 hoàn thành</span>
      </div>
      <div class="steps-track" id="steps-track"></div>
    </div>

    <!-- Tab content card -->
    <div class="content-card" id="content-card">
      <div class="tabs-nav" id="tabs-nav"></div>
      <div class="tab-body" id="tab-body"></div>
    </div>

  </div><!-- /wf-view -->

</main>

<!-- Toast xếp chồng (toast()) — vùng live tĩnh: phản hồi Copy ID / hủy / tải zip được đọc
     cho trình đọc màn hình mà không cắt ngang (polite); chỉ phần mới thêm được đọc. -->
<div id="toast-stack" class="toast-stack" role="status" aria-live="polite" aria-atomic="false"></div>

<!-- ── SVG ICONS ──────────────────────────────────────────────────────── -->
<svg style="display:none">
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <polyline points="20 6 9 17 4 12"/>
  </symbol>
  <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <line x1="18" y1="6" x2="6" y2="18"/>
    <line x1="6" y1="6" x2="18" y2="18"/>
  </symbol>
  <symbol id="icon-loader" viewBox="0 0 24 24" fill="none" stroke="currentColor">
    <line x1="12" y1="2" x2="12" y2="6"/>
    <line x1="12" y1="18" x2="12" y2="22"/>
    <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/>
    <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
    <line x1="2" y1="12" x2="6" y2="12"/>
    <line x1="18" y1="12" x2="22" y2="12"/>
    <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/>
    <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
  </symbol>
</svg>

<script>
/* ────────────────────────────────────────────────────────────────────────
   CONFIG
   ──────────────────────────────────────────────────────────────────────── */
const STEPS = [
  { role: 'ba',           label: 'BA',        name: 'Business Analysis' },
  { role: 'pm',           label: 'PM',        name: 'Project Management' },
  { role: 'sa',           label: 'SA',        name: 'Solution Architecture' },
  { role: 'ta',           label: 'TA',        name: 'Technical Architecture' },
  { role: 'designer',     label: 'Designer',  name: 'UI/UX Design' },
  { role: 'tl',           label: 'Team Lead', name: 'Engineering Task Planning' },
  { role: 'fe',           label: 'FE',        name: 'Frontend Engineering' },
  { role: 'mobile',       label: 'Mobile',    name: 'Mobile Engineering' },
  { role: 'dba',          label: 'DBA',       name: 'Database Architecture' },
  { role: 'be',           label: 'BE',        name: 'Backend Implementation' },
  { role: 'da',           label: 'DA',        name: 'Data Analysis' },
  { role: 'tech_lead',    label: 'Tech Lead', name: 'Code Review' },
  { role: 'tester',      label: 'Tester',    name: 'Testing & Quality' },
  { role: 'devsecops',    label: 'DevSecOps', name: 'CI/CD & Infra' },
  { role: 'clarifier',   label: 'Clarifier', name: 'Assumption & Gap Review' },
];
const POLL_MS     = 2500;
const POLL_MAX_MS = 30000;   // trần backoff khi poll lỗi tạm thời (xem pollBackoffMs)

// Badge của từng status. 'cancelled' (POST /workflow/{id}/cancel) là trạng thái kết thúc
// như completed/failed: badge xám, ngừng poll.
const STATUS_MAP = {
  pending:   { cls: 'badge-pending',   dot: true,  label: 'Pending' },
  running:   { cls: 'badge-running',   dot: true,  label: 'Running' },
  completed: { cls: 'badge-completed', dot: false, label: 'Completed' },
  failed:    { cls: 'badge-failed',    dot: false, label: 'Failed' },
  cancelled: { cls: 'badge-cancelled', dot: false, label: 'Cancelled' },
};

// HỢP ĐỒNG với agent-api: output của bước lỗi bắt đầu bằng "[LỖI" (app.py ghi role vào
// failed_steps); coding role sinh lỗi MỘT SỐ file thì output có section
// FILE_GEN_ERRORS_HEADER = "## ⚠️ File generation errors" (workflow.py — viết bằng \u
// escape để không phụ thuộc cách lưu emoji; FE0F tùy chọn).
const STEP_ERROR_PREFIX  = '[LỖI';
// Role có file artifact (khớp ARTIFACT_ROLES của agent-api/artifacts.py)
const ARTIFACT_ROLES = new Set(['fe', 'mobile', 'be', 'dba', 'devsecops', 'tech_lead', 'da']);
// Còn role đã xong mà /artifacts chưa có mục nào (vd. role không sinh file) → thử lại thưa
const ART_RETRY_MS   = 30000;
const TOAST_MAX      = 4;      // số toast hiện cùng lúc tối đa — cũ nhất bị bỏ trước

// Tên ngôn ngữ của fence / artifact → grammar highlight.js (hlLanguageOf). null = cố ý KHÔNG
// tô màu: không có grammar (Terraform/HCL), sơ đồ (mermaid, sơ đồ ASCII → plaintext), văn bản
// thô. Tên không có trong bảng được dùng nguyên văn nếu hljs biết (ts, py, yml, sh…), không
// thì để trơn. Map — không phải object — để fence ```constructor / ```toString không trúng
// prototype. Khối không ghi ngôn ngữ KHÔNG bao giờ được tô (hljs tự đoán sẽ tô sơ đồ thành CSS/SQL).
const HL_ALIASES = new Map([
  ['tf', null], ['hcl', null], ['terraform', null], ['mermaid', null], ['plantuml', null],
  ['text', null], ['txt', null], ['plaintext', null], ['plain', null], ['ascii', null], ['none', null],
  ['conf', 'nginx'], ['nginxconf', 'nginx'],
  ['dockerfile', 'dockerfile'], ['docker', 'dockerfile'], ['containerfile', 'dockerfile'],
  ['jenkinsfile', 'groovy'], ['gradle', 'groovy'],
  ['env', 'ini'], ['dotenv', 'ini'],
  ['shell', 'bash'], ['zsh', 'bash'],   // hljs "shell" = phiên terminal có prompt $; fence ```shell thường chỉ là lệnh
]);
const HL_MAX_CHARS = 200000;   // khối lớn hơn: để trơn (hljs chạy đồng bộ, khóa trang)
const FIRST_COL_NOWRAP_MAX = 32;   // cột đầu của bảng giữ một dòng khi mọi ô ≤ chừng này ký tự
const FILE_GEN_ERRORS_RE = /^##[ \t]*⚠️?[ \t]*File generation errors[ \t]*$/m;

/* ────────────────────────────────────────────────────────────────────────
   STATE
   ──────────────────────────────────────────────────────────────────────── */
let currentId    = null;   // workflow_id being tracked
let pollTimer    = null;   // setTimeout handle
let durTimer     = null;   // setInterval for live duration
let activeTab    = null;   // currently displayed tab role
let lastData     = null;   // last successful API response
let startTime    = null;   // Date of created_at for duration counter
let userPickedTab = false; // true when user manually clicked a tab
let artifactsCache = {};   // { role: [file_meta, ...] } — artifacts for current workflow
let subTabState  = {};     // { role: 'output'|'files' } — preserves sub-tab selection per role
let _lastBodyKey = null;   // chữ ký nội dung tab-body đã render — tránh rebuild thừa (giữ scroll)
let _stepEls     = null;   // [{ node, conn, circle, state }] — progress tracker dựng một lần
let _tabEls      = null;   // [{ btn, icon }] — thanh tab dựng một lần
let pollGen      = 0;      // "thế hệ" theo dõi — tăng mỗi lần stopAll(); response của thế hệ cũ bị bỏ qua
let pollAbort    = null;   // AbortController cho các request của thế hệ hiện tại
let pollInFlight = false;  // GET /workflow/{id} của thế hệ hiện tại đang bay (pollNow single-flight)
let pollAgain    = false;  // pollNow() gọi lúc đang bay → poll lại ngay khi response về
let pollPaused   = false;  // đã bỏ lượt poll vì tab ẩn → visibilitychange poll lại ngay
let pollTried    = false;  // thế hệ hiện tại đã gửi ít nhất một GET (lượt đầu chạy cả khi tab ẩn)
let pollFailures = 0;      // số lần poll lỗi tạm thời liên tiếp (5xx / mạng) → backoff
let cancelInFlight  = false; // POST /workflow/{id}/cancel đang bay → nút hủy bị khóa
let cancelRequested = false; // server đã nhận yêu cầu hủy (200) — chờ poll xác nhận
let mdReady      = false;  // marked + DOMPurify đã tải và cấu hình xong (xem setupMarkdown)
let jszipLoading = null;   // Promise nạp JSZip lười (xem loadJSZip) — null = chưa nạp / lần trước lỗi
let currentView  = 'empty'; // view đang hiện: 'empty' | 'recent' | 'wf' (showView)
let _artRolesKey = '';     // tập role artifact đã hoàn thành ở lần tải /artifacts gần nhất (shouldLoadArtifacts)
let _artLoadAt   = 0;      // Date.now() của lần tải /artifacts gần nhất trong lúc workflow chạy
let _hlObserver  = null;   // IntersectionObserver tô màu code lười (highlightCode)

/* ────────────────────────────────────────────────────────────────────────
   INIT — pick up workflow_id from URL query string
   ──────────────────────────────────────────────────────────────────────── */
(function init() {
  // Cấu hình marked TRƯỚC khi theo dõi: nếu thư viện thiếu, setupMarkdown() chỉ trả false
  // (render dùng text thô) chứ không ném lỗi làm hỏng cả init.
  setupMarkdown();
  trackHeaderHeight();

  const p = new URLSearchParams(window.location.search);
  const id = p.get('id');
  if (id) {
    document.getElementById('wid-input').value = id;
    trackWorkflow(id);
  }
  document.getElementById('wid-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') trackFromInput();
  });
  document.addEventListener('visibilitychange', onVisibilityChange);
  window.addEventListener('popstate', onPopState);
  // Nút Copy của khối code (output + viewer artifact) — một listener cho cả tab-body vì nội
  // dung bên trong được dựng lại khi đổi tab / có output mới.
  document.getElementById('tab-body').addEventListener('click', onTabBodyClick);
})();

/* ────────────────────────────────────────────────────────────────────────
   ENTRY POINTS
   ──────────────────────────────────────────────────────────────────────── */
function trackFromInput() {
  const id = document.getElementById('wid-input').value.trim();
  if (!id) return;
  trackWorkflow(id);
}

// opts.push === false: gọi từ popstate (Back/Forward) — URL đã đúng, không push thêm mục history.
function trackWorkflow(id, opts = {}) {
  stopAll();
  currentId    = id;
  activeTab    = null;
  userPickedTab = false;
  lastData     = null;
  startTime    = null;
  artifactsCache = {};   // Reset cache khi bắt đầu theo dõi workflow mới
  _lastBodyKey = null;   // buộc render lại tab-body cho workflow mới
  cancelInFlight  = false;
  cancelRequested = false;
  _artRolesKey = '';
  _artLoadAt   = 0;
  pollAbort    = new AbortController();   // stopAll() đã hủy request của lần theo dõi trước

  if (opts.push !== false) pushUrl(id);
  showView('wf');
  document.getElementById('wf-view').classList.add('wf-loading');
  document.getElementById('copy-btn').style.display = 'inline-flex';
  fetchAndUpdate();
}

/* ────────────────────────────────────────────────────────────────────────
   FETCH & POLL
   ──────────────────────────────────────────────────────────────────────── */
// Lỗi poll TẠM THỜI (5xx khi container agent-api khởi động lại, mất mạng, proxy trả HTML…)
// KHÔNG xóa view hay ngừng theo dõi: giữ dữ liệu lần cập nhật cuối, hiện banner và thử
// lại với backoff 2.5s → 5s → 10s → 20s → 30s (trần). Chỉ 404 (workflow không tồn tại)
// là lỗi cuối cùng. Tab ẩn (document.hidden) → tạm dừng poll, tiếp tục ngay khi hiện lại.
async function fetchAndUpdate() {
  if (!currentId) return;
  // Chốt workflow + thế hệ lúc gửi request. Nếu trong lúc chờ người dùng đã đổi
  // workflow / mở Recent (stopAll → pollGen tăng) thì bỏ response cũ: không render
  // dữ liệu workflow A dưới id B, không đặt thêm timer → không sinh vòng poll thứ hai.
  const gen   = pollGen;
  const id    = currentId;
  const stale = () => gen !== pollGen;
  pollTimer = null;   // timer (nếu có) vừa bắn xong
  // Tab đang ẩn → bỏ lượt này (không tốn request khi để tab nền hàng giờ); handler
  // visibilitychange gọi pollNow() ngay khi tab hiện lại. Lượt ĐẦU của mỗi lần theo dõi
  // vẫn chạy (tab mở ở nền có sẵn dữ liệu); nếu lượt đó lỗi thì cũng chờ tab hiện lại.
  if (document.hidden && pollTried) { pollPaused = true; return; }
  pollTried    = true;
  pollPaused   = false;
  pollInFlight = true;
  pollAgain    = false;

  let data;
  try {
    const res = await fetch(`/workflow/${encodeURIComponent(id)}`, { signal: pollAbort?.signal });
    if (stale()) return;
    if (!res.ok) {
      const j = await res.json().catch(() => null);
      if (stale()) return;
      if (res.status === 404) {
        // Workflow không tồn tại (id sai / đã bị xóa) → lỗi cuối cùng: dừng theo dõi.
        showError(String((j && j.detail) || res.statusText || 'HTTP 404'));
        stopAll();
        return;
      }
      const err = new Error(`HTTP ${res.status}`);
      err.status = res.status;
      throw err;
    }
    data = await res.json();
    if (stale()) return;
  } catch (e) {
    // Request của lần theo dõi cũ bị hủy (AbortError) hoặc đã lỗi thời → bỏ qua im lặng.
    if (stale() || e.name === 'AbortError') return;
    onPollFailure(e);
    return;
  } finally {
    // Chỉ thế hệ hiện tại được nhả cờ — stopAll() đã reset cho thế hệ mới.
    if (!stale()) pollInFlight = false;
  }

  // Poll thành công → xóa banner mất kết nối, reset backoff.
  pollFailures = 0;
  hideConnBanner();

  // Auto-set active tab to latest completed step on first meaningful load
  if (!userPickedTab) {
    const completed = data.completed_steps || [];
    if (completed.length > 0) {
      activeTab = completed[completed.length - 1];
    } else {
      activeTab = STEPS[0].role;
    }
  }

  lastData = data;
  // Lỗi render (bug UI / dữ liệu lạ) tách khỏi lỗi mạng: nếu nằm chung catch ở trên nó sẽ
  // bị retry mãi dưới banner "mất kết nối". Báo ra err-box (giữ view) và vẫn poll tiếp.
  try {
    renderAll(data);
    document.getElementById('err-box').style.display = 'none';
    document.getElementById('wf-view').classList.remove('wf-loading');
  } catch (e) {
    console.error('Render workflow lỗi:', e);
    showInlineError(`Lỗi hiển thị: ${e.message}`);
  }

  const live = isLive(data);
  setPollIndicator(live ? 'live' : false);
  if (live) {
    // pollNow() được gọi khi request vừa rồi đang bay (vd. vừa gửi hủy) → poll lại ngay.
    schedulePoll(pollAgain ? 0 : POLL_MS);
    // Tải artifact metadata trong khi chạy — chỉ khi có role artifact mới hoàn thành
    // (xem shouldLoadArtifacts). Array.isArray: dữ liệu lạ ở đây không được ném (ngoài try
    // → unhandled rejection).
    const _completedArt = (Array.isArray(data.completed_steps) ? data.completed_steps : [])
      .filter(r => ARTIFACT_ROLES.has(r));
    if (shouldLoadArtifacts(_completedArt, Date.now())) loadArtifacts(id);
  } else {
    stopDur();
    // Luôn tải lại artifact khi workflow kết thúc
    loadArtifacts(id);
  }
}

// Trong lúc chạy, chỉ tải lại /artifacts khi TẬP role artifact đã hoàn thành thay đổi; nếu
// vẫn còn role đã xong mà /artifacts chưa có mục nào thì thử lại sau ART_RETRY_MS. Trước đây
// một role không sinh file (vd. da chỉ có văn bản) khiến MỖI lần poll (2.5s) đều gọi /artifacts
// cho tới khi workflow kết thúc. Workflow kết thúc → fetchAndUpdate luôn tải lại một lần.
function shouldLoadArtifacts(completedArt, now) {
  const key     = [...completedArt].sort().join(',');
  const missing = completedArt.some(r => !(r in artifactsCache));
  if (key === _artRolesKey && !(missing && now - _artLoadAt >= ART_RETRY_MS)) return false;
  _artRolesKey = key;
  _artLoadAt   = now;
  return true;
}

// Luôn chỉ tồn tại đúng 1 timer poll.
function schedulePoll(ms) {
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = setTimeout(fetchAndUpdate, ms);
}

// Backoff khi poll lỗi tạm thời: lần lỗi thứ n (1, 2, 3…) → 2.5s, 5s, 10s, 20s, 30s, 30s…
function pollBackoffMs(failures) {
  return Math.min(POLL_MAX_MS, POLL_MS * 2 ** Math.max(0, failures - 1));
}

function onPollFailure(e) {
  pollFailures++;
  const delay = pollBackoffMs(pollFailures);
  const why   = e && e.status ? `HTTP ${e.status}` : 'không kết nối được';
  // Chỉ nói "giữ dữ liệu" khi thật sự có dữ liệu của workflow này đang hiển thị.
  const kept  = lastData ? 'đang giữ dữ liệu lần cập nhật cuối' : 'chưa tải được dữ liệu workflow';
  showConnBanner(`Mất kết nối tới agent-api (${why}) — ${kept}. `
    + `Thử lại sau ${delay / 1000} giây (lần ${pollFailures}).`);
  setPollIndicator('retry');
  schedulePoll(delay);
}

// Poll ngay — đường DUY NHẤT cho "Thử lại ngay", tab hiện lại và làm mới sau khi gửi hủy.
// Single-flight: đang có request bay thì chỉ đánh dấu pollAgain (response về sẽ poll lại
// ngay) thay vì mở request thứ hai (response về lệch thứ tự có thể render dữ liệu cũ hơn).
// pollAbort === null nghĩa là đã stopAll() (404, mở Recent) → không hồi sinh vòng poll.
function pollNow() {
  if (!currentId || !pollAbort) return;
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  if (pollInFlight) { pollAgain = true; return; }
  fetchAndUpdate();
}

function onVisibilityChange() {
  if (document.hidden) return;
  // Chỉ nối lại vòng poll còn sống: đã bỏ lượt vì tab ẩn, hoặc đang chờ timer/backoff.
  // Workflow đã kết thúc / 404 không có timer → không poll lại.
  if (pollPaused || pollTimer) pollNow();
}

/* ────────────────────────────────────────────────────────────────────────
   RENDER
   ──────────────────────────────────────────────────────────────────────── */
function renderAll(data) {
  renderStatusBar(data);
  renderProgress(data);
  renderTabs(data);
  renderTabBody(data);
}

/* Status bar / progress / tabs được dựng MỘT lần rồi chỉ đổi class/text tại chỗ khi
   giá trị thực sự thay đổi. Rebuild bằng innerHTML mỗi lần poll (2.5s) làm restart
   các animation (ring-pulse, blink, spin → giật), transition không bao giờ chạy
   (phần tử mới sinh ra đã ở trạng thái cuối) và làm mất focus bàn phím trên tab. */
function setText(el, value) {
  const v = String(value);
  if (el.textContent !== v) el.textContent = v;
}

// Cuộn ngang một dải (steps-track / tabs-nav) để phần tử vừa được chọn nằm trong
// khung nhìn — trên màn hẹp tab/step được auto-chọn thường nằm ngoài vùng thấy.
// Chỉ chỉnh scrollLeft của chính dải đó (không dùng scrollIntoView để trang không
// bị kéo theo chiều dọc khi poll tự chuyển tab trong lúc người dùng đang đọc).
function revealInStrip(strip, el) {
  const s = strip.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  if (r.left >= s.left && r.right <= s.right) return;
  strip.scrollLeft += (r.left + r.width / 2) - (s.left + s.width / 2);
}

/* ── Trạng thái từng bước (hàm thuần — test bằng node) ──────────────── */
function isLive(data) {
  return !!data && (data.status === 'running' || data.status === 'pending');
}

// Bước đang chạy: bước đầu tiên chưa xong, CHỈ khi status 'running'. Run 'pending' còn nằm
// trong hàng đợi — chưa bước nào chạy nên không vẽ spinner cho BA.
function currentStepOf(data) {
  if (!data || data.status !== 'running') return null;
  const completed = new Set(data.completed_steps || []);
  const s = STEPS.find(st => !completed.has(st.role));
  return s ? s.role : null;
}

// Bước lỗi. Khi đã có output, output là nguồn sự thật: Clarifier Regen Loop có thể chạy
// lại một bước lỗi thành công (hoặc làm hỏng một bước tốt) mà failed_steps không được
// cập nhật. Chưa có output → dựa vào failed_steps.
function isStepFailed(data, role) {
  const out = (data.step_outputs || {})[role];
  if (typeof out === 'string' && out.trim()) return out.trimStart().startsWith(STEP_ERROR_PREFIX);
  return (data.failed_steps || []).includes(role);
}

function hasFileGenErrors(output) {
  return FILE_GEN_ERRORS_RE.test(String(output || ''));
}

// Ưu tiên failed > warn > done > active > todo. Output lỗi toàn bộ ("[LỖI trong be] …")
// CŨNG chứa section "File generation errors" → phải xét failed trước warn. Bước lỗi vẫn
// nằm trong completed_steps (node trả về bình thường) → xét failed trước done.
function stepState(data, role) {
  if (isStepFailed(data, role)) return 'failed';
  if ((data.completed_steps || []).includes(role)) {
    return hasFileGenErrors((data.step_outputs || {})[role]) ? 'warn' : 'done';
  }
  return role === currentStepOf(data) ? 'active' : 'todo';
}

function isCancelling(data) {
  return isLive(data) && !!(data.cancel_requested || cancelRequested);
}

// Ghi chú dưới status bar: vị trí hàng đợi (pending) / đang hủy. queue_position 1 = chạy kế
// tiếp; so với null (không dùng truthiness) vì backend cũ không trả field này.
function statusNote(data) {
  if (!isLive(data)) return '';
  if (isCancelling(data)) {
    return data.status === 'pending' ? 'Đang hủy…' : 'Đang hủy — sẽ dừng sau bước hiện tại';
  }
  if (data.status === 'pending') {
    return data.queue_position != null
      ? `Đang chờ trong hàng đợi (vị trí ${data.queue_position})`
      : 'Đang chờ bắt đầu…';
  }
  return '';
}

function cancelBtnState(data) {
  if (!isLive(data))     return { show: false, disabled: true,  label: '✕ Hủy workflow' };
  if (cancelInFlight)    return { show: true,  disabled: true,  label: 'Đang gửi yêu cầu hủy…' };
  if (isCancelling(data)) return { show: true, disabled: true,  label: 'Đang hủy…' };
  return { show: true, disabled: false, label: '✕ Hủy workflow' };
}

/* ── Status bar ─────────────────────────────────────────────────────── */
function renderStatusBar(data) {
  const s = STATUS_MAP[data.status] || STATUS_MAP.failed;

  // Khi đã xong 15/15 nhưng status vẫn 'running' → đang chạy Clarifier Regen Loop
  // (re-gen các engineer role + chạy lại Clarifier). Nói rõ để không hiểu nhầm là treo.
  // Tắt vòng này bằng CLARIFIER_REGEN_LOOPS=0 trong .env.
  const _allStepsDone = (data.completed_steps || []).length >= STEPS.length;
  const _label = isCancelling(data)
    ? 'Cancelling…'
    : (data.status === 'running' && _allStepsDone)
      ? 'Running — Clarifier regen…'
      : s.label;

  // Cập nhật tại chỗ — giữ nguyên phần tử .blink-dot để animation không restart mỗi poll
  const pill = document.getElementById('status-pill');
  const pillCls = 'badge ' + s.cls;
  if (pill.className !== pillCls) pill.className = pillCls;
  document.getElementById('status-dot').style.display = s.dot ? '' : 'none';
  setText(document.getElementById('status-label'), _label);

  // Duration
  if (isLive(data) && !startTime) {
    startTime = new Date(data.created_at);
    startDur();
  }
  if (!isLive(data)) stopDur();

  const dur = data.completed_at
    ? fmtDur(new Date(data.created_at), new Date(data.completed_at))
    : (startTime ? fmtDur(startTime, new Date()) : '—');

  // textContent (không phải innerHTML) → giá trị từ API không bao giờ được parse thành HTML
  setText(document.getElementById('meta-project'), data.project || '—');
  const _started = document.getElementById('meta-started');
  setText(_started, fmtTime(data.created_at));
  const _startedTitle = fmtFullTime(data.created_at);
  if (_started.title !== _startedTitle) _started.title = _startedTitle;
  setText(document.getElementById('dur-val'), dur);
  setText(document.getElementById('meta-steps'), `${(data.completed_steps || []).length} / ${STEPS.length}`);
  const _nFailed = STEPS.filter(st => isStepFailed(data, st.role)).length;
  setText(document.getElementById('meta-steps-failed'), _nFailed ? ` · ✗ ${_nFailed} lỗi` : '');
  document.getElementById('meta-error').style.display = data.error ? '' : 'none';
  setText(document.getElementById('meta-error-val'), data.error || '');

  renderCancelUi();
}

// Nút hủy + ghi chú trạng thái — gọi lại cả khi POST /cancel bắt đầu/kết thúc (không chờ poll)
function renderCancelUi() {
  const st  = cancelBtnState(lastData);
  const btn = document.getElementById('cancel-btn');
  btn.style.display = st.show ? '' : 'none';
  document.getElementById('status-bar').classList.toggle('has-actions', st.show);
  if (btn.disabled !== st.disabled) btn.disabled = st.disabled;
  setText(btn, st.label);

  const note   = statusNote(lastData);
  const noteEl = document.getElementById('status-note');
  noteEl.style.display = note ? '' : 'none';
  setText(noteEl, note);
}

/* ── Progress tracker ───────────────────────────────────────────────── */
const STEP_TITLES = { failed: 'Bước này thất bại', warn: 'Một số file không sinh được' };

function renderProgress(data) {
  const completed = new Set(data.completed_steps || []);

  setText(document.getElementById('steps-done'), completed.size);

  const track = document.getElementById('steps-track');
  if (!_stepEls) {
    // Dựng 15 node + 14 connector một lần; các lần poll sau chỉ toggle class
    track.innerHTML = '';
    _stepEls = STEPS.map((step, i) => {
      let conn = null;
      if (i > 0) {
        conn = document.createElement('div');
        conn.className = 'step-connector';
        track.appendChild(conn);
      }
      const node = document.createElement('div');
      node.className = 'step-node';
      node.onclick = () => selectTab(step.role);
      node.innerHTML = `
        <div class="step-circle"></div>
        <div class="step-label">${step.label}</div>
        <div class="step-sublabel">${step.name}</div>`;
      track.appendChild(node);
      return { node, conn, circle: node.querySelector('.step-circle'), state: null };
    });
  }

  let newlyRunning = null;   // node vừa chuyển sang 'active' (bước đang chạy đổi) ở lượt này
  STEPS.forEach((step, i) => {
    const el         = _stepEls[i];
    const state      = stepState(data, step.role);
    const isSelected = step.role === activeTab;

    // Connector (trước mỗi step trừ step đầu)
    if (el.conn) {
      const prevDone = completed.has(STEPS[i - 1].role);
      el.conn.classList.toggle('done',   completed.has(step.role) && prevDone);
      el.conn.classList.toggle('active', state === 'active' && prevDone);
    }

    // toggle(cls, bool) không đụng DOM khi class đã đúng → animation/transition giữ nguyên
    const wasSelected = el.node.classList.contains('selected');
    if (state === 'active' && !el.node.classList.contains('active')) newlyRunning = el.node;
    el.node.classList.toggle('done',     state === 'done');
    el.node.classList.toggle('warn',     state === 'warn');
    el.node.classList.toggle('failed',   state === 'failed');
    el.node.classList.toggle('active',   state === 'active');
    el.node.classList.toggle('selected', isSelected);
    if (isSelected && !wasSelected) revealInStrip(track, el.node);

    // Chỉ thay icon trong vòng tròn khi trạng thái đổi (thay mỗi poll sẽ restart spin)
    if (el.state !== state) {
      el.state = state;
      el.node.title = STEP_TITLES[state] || '';
      if (state === 'done' || state === 'warn') {
        el.circle.innerHTML = `<svg><use href="#icon-check"/></svg>`;
      } else if (state === 'failed') {
        el.circle.innerHTML = `<svg><use href="#icon-x"/></svg>`;
      } else if (state === 'active') {
        el.circle.innerHTML = `<svg style="animation:spin .8s linear infinite"><use href="#icon-loader"/></svg>`;
      } else {
        el.circle.textContent = `${i + 1}`;
      }
    }
  });
  // Bước đang chạy vừa đổi → cuộn nó vào khung của dải tiến trình (trên màn hẹp bước 9+
  // nằm ngoài vùng thấy). Chạy sau reveal của bước được chọn nên bước đang chạy thắng.
  if (newlyRunning) revealInStrip(track, newlyRunning);
}

/* ── Tabs ───────────────────────────────────────────────────────────── */
const TAB_ICONS = { done: '✓', warn: '⚠', failed: '✗', active: '⟳', todo: '○' };

function renderTabs(data) {
  const nav = document.getElementById('tabs-nav');
  if (!_tabEls) {
    // Dựng 15 nút một lần — giữ nguyên phần tử để focus bàn phím không mất mỗi poll
    nav.innerHTML = '';
    _tabEls = STEPS.map(step => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.innerHTML = `<span class="tab-icon"></span>${step.label}`;
      btn.onclick = () => selectTab(step.role);
      nav.appendChild(btn);
      return { btn, icon: btn.firstChild };
    });
  }

  STEPS.forEach((step, i) => {
    const { btn, icon } = _tabEls[i];
    const state  = stepState(data, step.role);
    const isActv = step.role === activeTab;

    setText(icon, TAB_ICONS[state]);
    const title = STEP_TITLES[state] || '';
    if (btn.title !== title) btn.title = title;
    const wasActv = btn.classList.contains('active');
    btn.classList.toggle('t-done', state === 'done');
    btn.classList.toggle('t-warn', state === 'warn');
    btn.classList.toggle('t-fail', state === 'failed');
    btn.classList.toggle('t-run',  state === 'active');
    btn.classList.toggle('active', isActv);
    if (isActv && !wasActv) revealInStrip(nav, btn);
  });
}

/* ── Tab body ───────────────────────────────────────────────────────── */
function renderTabBody(data) {
  const completed   = new Set(data.completed_steps || []);
  const running     = isLive(data);
  const currentStep = currentStepOf(data);

  const body = document.getElementById('tab-body');
  const step = STEPS.find(s => s.role === activeTab);
  if (!step) return;

  const _stepOutputs = data.step_outputs || {};
  const _hasKey      = activeTab in _stepOutputs;
  const output       = _stepOutputs[activeTab] || "";
  const state        = stepState(data, activeTab);
  const cancelling   = isCancelling(data);

  // Tránh rebuild DOM tab-body mỗi lần poll khi nội dung KHÔNG đổi — rebuild làm
  // reset vị trí scroll của bảng/diagram/code đang xem. Chỉ render lại khi "chữ ký"
  // thay đổi (đổi tab, step có output mới, trạng thái/hàng đợi/hủy đổi, artifact vừa
  // tải xong). Lưu ý: sub-tab (Output/Files) do switchSubTab tự toggle display nên KHÔNG
  // nằm trong chữ ký → lựa chọn sub-tab của người dùng được giữ nguyên qua các lần poll.
  // Chữ ký nội dung (không chỉ độ dài): Clarifier regen có thể sinh lại output CÙNG độ dài,
  // hoặc đổi file artifact (tên/kích thước) mà số file giữ nguyên → vẫn phải render lại.
  const roleArts = (artifactsCache[activeTab] || []).filter(f => !f.filename.startsWith('_'));
  const _bodyKey = [
    activeTab,
    _hasKey ? 1 : 0,
    output.length + ':' + hashStr(output),
    data.status,
    state,
    currentStep || '',   // "Chờ hoàn thành N bước trước" phụ thuộc bước đang chạy
    data.status === 'pending' && data.queue_position != null ? data.queue_position : '',
    state === 'active' && cancelling ? 'x' : '',
    roleArts.length + ':' + hashStr(artifactSig(roleArts)),
  ].join('|');
  if (_bodyKey === _lastBodyKey) return;   // không đổi → giữ nguyên DOM + scroll
  _lastBodyKey = _bodyKey;
  // Nội dung cũ sắp bị thay → bỏ các khối code cũ khỏi hàng đợi tô màu lười
  if (_hlObserver) _hlObserver.disconnect();

  if (_hasKey && output && output.trim()) {
    // Có output — render markdown (đã sanitize, xem renderMarkdown) + panel files nếu có
    // artifact. Bước lỗi / có file sinh lỗi → thông báo rõ ở đầu tab, trước nội dung.
    const notice = state === 'failed'
      ? `<div class="step-notice step-notice-err" role="alert"><strong>✗ Bước này thất bại</strong>`
        + `Agent gặp lỗi nên không có kết quả dùng được — chi tiết lỗi ở bên dưới. `
        + `Các bước sau có thể thiếu đầu vào từ bước này.</div>`
      : state === 'warn'
        ? `<div class="step-notice step-notice-warn" role="status"><strong>⚠ Một số file không sinh được</strong>`
          + `Các file còn lại vẫn dùng được — danh sách file lỗi nằm ở mục `
          + `“File generation errors” bên dưới.</div>`
        : '';
    const clean    = renderMarkdown(output);
    const filesBtn = roleArts.length
      ? `<button class="sub-tab-btn" id="stb-files" onclick="switchSubTab('files')">📁 Files <span class="art-count">${roleArts.length}</span></button>`
      : '';
    const curSubTab    = subTabState[activeTab] || 'output';  // restore persisted selection
    const outActive    = curSubTab === 'output' ? ' active' : '';
    const outDisplay   = curSubTab === 'output' ? '' : 'none';
    const filesDisplay = curSubTab === 'files'  ? '' : 'none';
    const subTabRow = filesBtn
      ? `<div class="sub-tab-row"><button class="sub-tab-btn${outActive}" id="stb-output" onclick="switchSubTab('output')">📄 Output</button>${filesBtn}</div>`
      : '';
    body.innerHTML = `
      ${notice}
      ${subTabRow}
      <div id="sub-output" style="display:${outDisplay}"><div class="md">${clean}</div></div>
      <div id="sub-files" style="display:${filesDisplay}">${renderFileTree(activeTab, roleArts)}</div>`;
    // Restore active class on Files button when Files sub-tab is selected
    if (curSubTab === 'files') {
      const btnFil = document.getElementById('stb-files');
      if (btnFil) btnFil.classList.add('active');
    }
    // Nút Copy cho từng khối code, rồi tô màu lười (chỉ khối có ngôn ngữ hljs biết)
    addCodeCopyButtons(body);
    highlightCode(body);
    // Wrap every table in a scrollable container so wide tables don't overflow
    body.querySelectorAll('.md table').forEach(tbl => {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      tbl.parentNode.insertBefore(wrap, tbl);
      wrap.appendChild(tbl);
      const firstCol = Array.from(tbl.querySelectorAll('tbody td:first-child'), td => td.textContent);
      if (shortFirstColumn(firstCol)) tbl.classList.add('first-col-nowrap');
    });
    // Sơ đồ ASCII bị LLM quên bọc ``` đã được chuyển thành <pre> ngay trong lúc
    // parse markdown (xem promoteAsciiDiagram) — dựa trên markdown NGUỒN, không phải
    // HTML đã render.

  } else if (state === 'failed') {
    // Lỗi nhưng không có output để hiện (failed_steps có role, step_outputs không có)
    body.innerHTML = `
      <div class="state-box">
        <div class="big-icon">✗</div>
        <h3 style="color:var(--err)">${step.name}</h3>
        <p>Bước này thất bại và không để lại output. Xem mục <strong>Error</strong> ở thanh trạng thái phía trên.</p>
      </div>`;

  } else if (_hasKey) {
    // Hoàn thành nhưng output rỗng (model quá nhỏ hoặc context overflow)
    body.innerHTML = `
      <div class="state-box">
        <div class="big-icon">⚠️</div>
        <h3 style="color:var(--warn)">${step.name}</h3>
        <p>Bước này đã hoàn thành nhưng không sinh ra output.<br>
           Có thể do model quá nhỏ hoặc context vượt giới hạn. Thử dùng model mạnh hơn.</p>
      </div>`;

  } else if (data.status === 'pending' && !completed.has(step.role)) {
    // Run còn trong hàng đợi — chưa bước nào chạy
    const qp = data.queue_position;
    body.innerHTML = `
      <div class="state-box">
        <div class="big-icon">⏳</div>
        <h3>${step.name}</h3>
        <p>${qp != null
          ? `Đang chờ trong hàng đợi (vị trí ${esc(qp)}) — workflow bắt đầu khi các lần chạy trước xong.`
          : 'Workflow đang chờ bắt đầu…'}</p>
      </div>`;

  } else if (step.role === currentStep) {
    // Currently running
    body.innerHTML = `
      <div class="state-box">
        <div class="spinner"></div>
        <h3>${step.name}</h3>
        <p>${cancelling
          ? 'Đã yêu cầu hủy — workflow sẽ dừng khi bước này xong.'
          : 'Agent đang xử lý… Kết quả sẽ hiển thị tại đây khi hoàn thành.'}</p>
      </div>`;

  } else if (completed.has(step.role)) {
    // Completed but step_outputs not included (shouldn't happen normally)
    body.innerHTML = `
      <div class="state-box">
        <div class="spinner"></div>
        <p>Đang tải output…</p>
      </div>`;

  } else if (running && currentStep) {
    // Pending step — workflow still running
    const stepIdx    = STEPS.findIndex(s => s.role === step.role);
    const currentIdx = STEPS.findIndex(s => s.role === currentStep);
    const stepsAway  = stepIdx - currentIdx;
    body.innerHTML = `
      <div class="state-box">
        <div class="big-icon">⏳</div>
        <h3>${step.name}</h3>
        <p>Chờ hoàn thành ${stepsAway} bước trước.
           Hiện tại đang xử lý: <strong>${STEPS.find(s => s.role === currentStep).name}</strong></p>
      </div>`;

  } else {
    // Not started / workflow ended before this step
    const why = data.status === 'cancelled' ? 'Không chạy — workflow đã bị hủy trước bước này.'
              : data.status === 'failed'    ? 'Không chạy — workflow dừng vì lỗi.'
              : 'Chưa chạy.';
    body.innerHTML = `
      <div class="state-box">
        <div class="big-icon" style="opacity:.35">○</div>
        <h3 style="color:var(--muted)">${step.name}</h3>
        <p>${why}</p>
      </div>`;
  }
}

// Cột đầu của bảng giữ một dòng (ID kiểu "FR-001", tên ngắn) chỉ khi MỌI ô đều ngắn — cột
// đầu là câu dài mà nowrap thì tràn sang cột bên cạnh / kéo bảng rộng gấp mấy lần màn hình.
function shortFirstColumn(texts) {
  return texts.every(t => String(t).trim().length <= FIRST_COL_NOWRAP_MAX);
}

/* ── Markdown → HTML an toàn (có đường lui) ─────────────────────────── */
// marked + DOMPurify nạp từ /ui/static/vendor/. Nếu một trong hai không tải được (file
// thiếu, bị chặn…) hoặc parse/sanitize ném lỗi → hiện output dạng text thô đã esc() trong
// <pre> thay vì ném: lỗi ném ra trong renderTabBody rơi vào catch của fetchAndUpdate →
// showError + stopAll → trang NGỪNG poll (trước đây: "marked is not defined").
// Dùng `typeof X` (không phải window.X) để chạy được cả trong vm của test node.
function setupMarkdown() {
  mdReady = false;
  try {
    if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
      console.warn('Không tải được marked/DOMPurify — output hiển thị dạng text thô.');
      return false;
    }
    marked.setOptions({ breaks: true, gfm: true });
    marked.use({ walkTokens: promoteAsciiDiagram });
    mdReady = true;
  } catch (e) {
    console.warn('Cấu hình marked lỗi — output hiển thị dạng text thô:', e);
  }
  return mdReady;
}

function renderMarkdown(src) {
  if (mdReady) {
    try {
      // DOMPurify đã chặn script/on*; cấm thêm id/name (HTML thô trong output agent có
      // thể trùng id của trang như "art-viewer"/"sub-files" → getElementById trỏ nhầm)
      // và <style>/<form> (CSS thô không bọc ``` sẽ áp lên toàn trang).
      return DOMPurify.sanitize(marked.parse(String(src)), {
        FORBID_TAGS: ['style', 'form'],
        FORBID_ATTR: ['id', 'name'],
      });
    } catch (e) {
      console.warn('Render markdown lỗi — hiển thị text thô:', e);
    }
  }
  // KHÔNG bao giờ chèn HTML của marked khi thiếu DOMPurify — chỉ text đã esc().
  return `<p class="md-fallback-note">⚠️ Không định dạng được markdown — đang hiện nội dung thô.</p>`
       + `<pre class="md-fallback">${esc(src)}</pre>`;
}

// Tên ngôn ngữ (```Dockerfile, language của artifact…) → tên grammar hljs đã nạp, hoặc null
// = không tô màu. Không phân biệt hoa thường. Xem HL_ALIASES.
function hlLanguageOf(name) {
  const key = String(name || '').trim().toLowerCase();
  if (!key || typeof hljs === 'undefined') return null;
  const lang = HL_ALIASES.has(key) ? HL_ALIASES.get(key) : key;
  return lang && hljs.getLanguage(lang) ? lang : null;
}

// Tô màu MỘT khối <code class="language-xxx"> (mỗi khối một lần). Dùng hljs.highlight với
// ngôn ngữ đã phân giải — không dùng highlightElement (khối lạ sẽ rơi vào tự đoán / cảnh báo).
// Lỗi của một khối không được làm hỏng cả lượt render (→ trang ngừng poll).
function highlightBlock(code) {
  if (code.dataset.hl) return;
  code.dataset.hl = '1';
  const m    = /(?:^|\s)language-(\S+)/.exec(code.className || '');
  const lang = m && hlLanguageOf(m[1]);
  if (!lang) return;
  const text = code.textContent;
  if (text.length > HL_MAX_CHARS) return;
  try {
    code.innerHTML = hljs.highlight(text, { language: lang, ignoreIllegals: true }).value;
    code.classList.add('hljs');
  } catch (e) { console.warn('highlight.js lỗi:', e); }
}

// Tô màu code bằng highlight.js (nếu đã tải) — LƯỜI: chỉ khi khối sắp vào khung nhìn
// (IntersectionObserver, nới 300px), nên output dài với hàng chục khối không khóa trang mỗi
// lần render; khối trong sub-tab đang ẩn được tô khi người dùng mở nó. Trình duyệt không có
// IntersectionObserver → tô ngay. Chỉ xét khối có class language-* (khối ``` trơn bỏ qua).
function highlightCode(root) {
  if (typeof hljs === 'undefined') return;
  const blocks = Array.from(root.querySelectorAll('pre code[class*="language-"]'));
  if (typeof IntersectionObserver === 'undefined') {
    blocks.forEach(highlightBlock);
    return;
  }
  if (!_hlObserver) {
    _hlObserver = new IntersectionObserver(entries => {
      for (const en of entries) {
        if (!en.isIntersecting) continue;
        _hlObserver.unobserve(en.target);
        const code = en.target.querySelector('code');
        if (code) highlightBlock(code);
      }
    }, { rootMargin: '300px 0px' });
  }
  blocks.forEach(code => _hlObserver.observe(code.parentElement || code));
}

// Bọc mỗi <pre> của output markdown trong .code-wrap kèm nút Copy (đặt TRƯỚC <pre> để thứ tự
// Tab hợp lý). Bỏ qua <pre class="md-fallback"> (text thô khi không render được markdown).
function addCodeCopyButtons(root) {
  root.querySelectorAll('.md pre:not(.md-fallback)').forEach(pre => {
    const wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    pre.parentNode.insertBefore(wrap, pre);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'code-copy js-copy-code';
    btn.textContent = 'Copy';
    btn.setAttribute('aria-label', 'Sao chép khối code');
    wrap.appendChild(btn);
    wrap.appendChild(pre);
  });
}

function onTabBodyClick(e) {
  const btn = e.target && e.target.closest ? e.target.closest('.js-copy-code') : null;
  if (!btn) return;
  const holder = btn.closest('.code-wrap, .art-viewer');
  const src    = holder && (holder.querySelector('pre code') || holder.querySelector('pre'));
  if (src) copyCode(btn, src.textContent);
}

// Sao chép một khối code (textContent — vẫn đúng nguyên văn sau khi hljs chèn span) + phản hồi
// ngay trên nút và qua toast (vùng live, trình đọc màn hình đọc được).
async function copyCode(btn, text) {
  const ok = await copyText(text);
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.textContent = ok ? '✓ Đã chép' : '✗ Lỗi';
  clearTimeout(Number(btn.dataset.timer));
  btn.dataset.timer = String(setTimeout(() => { btn.textContent = btn.dataset.label; }, 1500));
  if (ok) toast('✓ Đã sao chép khối code', 'ok');
  else toast('✗ Không sao chép được — hãy chọn và chép thủ công.', 'err');
}

/* ── Sơ đồ ASCII không bọc code fence ───────────────────────────────── */
// LLM đôi khi quên ``` quanh sơ đồ sequence/flow/wireframe → markdown render thành
// <p> font tỉ lệ, lệch cột. Heuristic chạy trên markdown NGUỒN của từng paragraph
// (giữ nguyên "<---->", khoảng trắng căn cột) và cố ý CHẶT để không bắt nhầm văn xuôi
// như "[Confirmed] Users log in via e-mail":
//   1. ≥3 ký tự box-drawing (U+2500–U+257F), hoặc
//   2. ≥2 dòng LIÊN TIẾP có cấu trúc sơ đồ: mũi tên/đường nối ASCII (-->, <--, ==>,
//      ---, +--), ≥2 dấu '|', box-drawing, hoặc dòng chỉ gồm ký tự nối (|, v, ^, ↓…).
// Dòng mở đầu bằng tag văn xuôi [Confirmed]/[Assumption]/[Proposed]/[GAP]… không bao
// giờ được tính; inline code (`a | b`) bị bỏ qua trước khi xét.
function looksLikeAsciiDiagram(src) {
  const TAG  = /^\s*[*_]{0,2}\[(?:confirmed|assum\w*|open questions?|proposed|draft|estimate[\w-]*|contradiction|gap|vague|missing|resolved|requires human input|risk|note|todo|tbd)\b[^\]\n]*\]/i;
  const BOX  = /[\u2500-\u257F]/g;
  const LINK = /<[-=]{2,}|[-=]{2,}>|-{3,}|={3,}|\+-{2,}/;
  const RAIL = /^[\s|+:.v^V↓↑▼▲]*[|v^V↓↑▼▲][\s|+:.v^V↓↑▼▲]*$/;
  let boxChars = 0, run = 0, bestRun = 0;
  for (const rawLine of String(src || '').split('\n')) {
    const line = rawLine.replace(/`[^`\n]*`/g, '');
    const isTag = TAG.test(line);
    const nBox  = isTag ? 0 : (line.match(BOX) || []).length;
    boxChars += nBox;
    const structural = !isTag && line.trim() !== '' && (
      nBox > 0 || LINK.test(line) || (line.match(/\|/g) || []).length >= 2 || RAIL.test(line));
    run = structural ? run + 1 : 0;
    bestRun = Math.max(bestRun, run);
  }
  return boxChars >= 3 || bestRun >= 2;
}

// walkTokens của marked: khối văn bản trông như sơ đồ → đổi thành code block "plaintext"
// với nội dung là markdown nguồn. marked tự escape khi render (không mất "<---->"
// như cách cũ lấy innerHTML rồi strip tag), hljs nhận "plaintext" nên không tô màu.
function promoteAsciiDiagram(token) {
  const toCode = (t, src) => {
    t.type    = 'code';
    t.lang    = 'plaintext';
    t.text    = src.replace(/\n+$/, '');
    t.escaped = false;
    delete t.tokens;
  };
  if (token.type === 'paragraph') {
    if (looksLikeAsciiDiagram(token.raw)) toCode(token, token.raw);
  } else if (token.type === 'list_item') {
