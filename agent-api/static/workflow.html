    // Trong list item marked dùng token 'text' (không phải 'paragraph') cho khối văn bản;
    // nguồn đã dedent nằm ở .text (.raw có thể bị ghép thừa '\n').
    for (const t of token.tokens || []) {
      if (t.type === 'text' && t.tokens && looksLikeAsciiDiagram(t.text)) toCode(t, t.text);
    }
  }
}

function selectTab(role) {
  userPickedTab = true;
  activeTab     = role;
  _lastBodyKey  = null;   // người dùng đổi tab → luôn render lại body
  if (lastData) {
    renderProgress(lastData);
    renderTabs(lastData);
    renderTabBody(lastData);
    revealTabStart();
  }
}

// Đổi tab khi thanh tab đang dính (đã cuộn sâu trong output dài) → cuộn về đầu nội dung tab
// mới (ngay dưới header) thay vì để người dùng ở giữa một output khác.
function revealTabStart() {
  const card   = document.getElementById('content-card');
  const header = document.getElementById('app-header');
  if (!card || !card.getBoundingClientRect || !header) return;
  const top = card.getBoundingClientRect().top;
  const hh  = header.offsetHeight || 0;
  if (typeof top === 'number' && top < hh) window.scrollBy(0, top - hh);
}

// --header-h = chiều cao thật của header sticky (56px; ≤640px gập 2 hàng → cao hơn), để
// thanh tab dính ngay dưới header chứ không chui xuống dưới nó.
function trackHeaderHeight() {
  const header = document.getElementById('app-header');
  const root   = document.documentElement;
  if (!header || !root || !root.style) return;
  const update = () => {
    const h = header.offsetHeight;
    if (h) root.style.setProperty('--header-h', h + 'px');
  };
  update();
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(update).observe(header);
  else window.addEventListener('resize', update);
}

/* ────────────────────────────────────────────────────────────────────────
   RECENT WORKFLOWS
   ──────────────────────────────────────────────────────────────────────── */
async function showRecent() {
  stopAll();
  showView('recent');
  const grid = document.getElementById('recent-grid');
  grid.innerHTML = '<span style="color:var(--muted);font-size:12px">Loading…</span>';

  try {
    const res  = await fetch('/workflows');
    const data = await res.json();

    if (!data.workflows.length) {
      grid.innerHTML = '<span style="color:var(--muted);font-size:12px">Chưa có workflow nào.</span>';
      return;
    }

    grid.innerHTML = '';
    data.workflows.forEach(w => {
      const iconMap = { pending:'⏳', running:'⟳', completed:'✓', failed:'✗', cancelled:'⊘' };
      const icon    = iconMap[w.status] || '?';
      const chip    = document.createElement('div');
      chip.className = 'recent-chip';
      chip.title     = fmtFullTime(w.created_at);
      // Dữ liệu server (đặc biệt project do người dùng nhập) → luôn esc() (chống stored XSS).
      chip.innerHTML = `
        <div class="rc-id">${icon} ${esc(String(w.workflow_id).substring(0, 16))}…</div>
        <div class="rc-meta">${esc(w.project || 'no project')} · ${esc(w.completed_steps)}/${esc(w.total_steps)} steps · ${esc(fmtTime(w.created_at))}</div>`;
      chip.onclick = () => {
        document.getElementById('wid-input').value = w.workflow_id;
        trackWorkflow(w.workflow_id);
      };
      grid.appendChild(chip);
    });
  } catch (e) {
    grid.innerHTML = `<span style="color:var(--err);font-size:12px">Error: ${esc(e.message)}</span>`;
  }
}

function showInlineError(msg) {

  box.textContent = '⚠️  ' + msg;
  box.style.display = 'block';
}

function showConnBanner(msg) {
  setText(document.getElementById('conn-banner-text'), msg);
  document.getElementById('conn-banner').style.display = '';
}

function hideConnBanner() {
  document.getElementById('conn-banner').style.display = 'none';
}

function stopAll() {
  // Tăng thế hệ + hủy request đang bay → response/timer của lần theo dõi trước tự bỏ qua.
  pollGen++;
  if (pollAbort) { pollAbort.abort(); pollAbort = null; }
  if (pollTimer) { clearTimeout(pollTimer);  pollTimer = null; }
  pollInFlight = false;
  pollAgain    = false;
  pollPaused   = false;
  pollTried    = false;
  pollFailures = 0;
  hideConnBanner();
  stopDur();
  setPollIndicator(false);
}

// mode: false (ẩn) | 'live' (đang poll) | 'retry' (poll lỗi tạm thời, đang chờ thử lại).
// Giữ nguyên phần tử .blink-dot (chỉ đổi class) → animation không restart.
function setPollIndicator(mode) {
  const el = document.getElementById('poll-indicator');
  el.style.display = mode ? 'flex' : 'none';
  el.classList.toggle('retry', mode === 'retry');
  setText(document.getElementById('poll-text'), mode === 'retry' ? 'Mất kết nối…' : 'Polling…');
}

// Toast xếp chồng trong #toast-stack (vùng live role="status", có sẵn trong HTML).
// kind: 'info' | 'ok' | 'warn' | 'err' — viền trái đổi màu; lỗi hiện lâu hơn để kịp đọc.
// textContent (không innerHTML) → msg có chứa dữ liệu server cũng không thành HTML.
function toast(msg, kind = 'info', ms) {
  const stack = document.getElementById('toast-stack');
  const t = document.createElement('div');
  t.className = 'toast toast-' + kind;
  t.textContent = msg;
  stack.appendChild(t);
  // Giữ tối đa TOAST_MAX toast — bỏ các cái cũ nhất
  Array.from(stack.children).slice(0, -TOAST_MAX).forEach(c => c.remove());
  setTimeout(() => t.remove(), ms || (kind === 'err' ? 6000 : 3000));
  return t;
}

// Sao chép text vào clipboard → Promise<boolean>, không bao giờ reject.
// navigator.clipboard chỉ có trong secure context (https / localhost) — UI thường được mở
// qua http://<ip>:8000 nên trước đây Copy ID ném "reading 'writeText'" và không báo gì.
// Đường lui: textarea ẩn + document.execCommand('copy') (vẫn chạy ở http thường).
async function copyText(text) {
  text = String(text);
  try {
    if (typeof navigator !== 'undefined' && navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* bị từ chối quyền / tài liệu không focus → thử đường lui */ }
  return legacyCopy(text);
}

function legacyCopy(text) {
  const prev = document.activeElement;
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');        // không bật bàn phím ảo trên điện thoại
  ta.setAttribute('aria-hidden', 'true');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none';
  document.body.appendChild(ta);
  let ok = false;
  try {
    ta.focus({ preventScroll: true });
    ta.select();
    ta.setSelectionRange(0, text.length);
    ok = !!document.execCommand('copy');
  } catch (e) { ok = false; }
  ta.remove();
  // Trả focus về nút vừa bấm (người dùng bàn phím không bị mất vị trí)
  if (prev && typeof prev.focus === 'function') {
    try { prev.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
  return ok;
}

/* ── Hủy workflow ───────────────────────────────────────────────────── */
// POST /workflow/{id}/cancel → 200 {workflow_id, status}: run pending bị hủy ngay
// (status "cancelled"); run đang chạy nhận cancel_requested và dừng sau bước hiện tại
// (status vẫn "running"). 404 = không tìm thấy (hoặc agent-api cũ chưa có endpoint),
// 409 = đã kết thúc. Cả hai chỉ báo toast + poll lại — trạng thái thật luôn lấy từ GET;
// chỉ 404 của GET mới được dừng theo dõi.
async function requestCancel() {
  if (!currentId || cancelInFlight || !isLive(lastData) || isCancelling(lastData)) return;
  if (!confirm('Hủy workflow này?\n\nBước đang chạy sẽ chạy nốt rồi workflow dừng; '
             + 'các bước sau không chạy. Không hoàn tác được.')) return;
  const gen = pollGen;
  const id  = currentId;   // chốt id: đổi workflow trong lúc chờ không hủy nhầm / báo nhầm
  cancelInFlight = true;
  renderCancelUi();
  try {
    const res = await fetch(`/workflow/${encodeURIComponent(id)}/cancel`, { method: 'POST' });
    if (gen !== pollGen) return;
    if (res.ok) {
      const j = await res.json().catch(() => ({}));
      if (gen !== pollGen) return;
      cancelRequested = true;
      toast(j.status === 'cancelled'
        ? '✓ Đã hủy workflow.'
        : '✓ Đã gửi yêu cầu hủy — workflow sẽ dừng sau bước hiện tại.', 'ok');
    } else if (res.status === 409) {
      toast('Workflow đã kết thúc — không còn gì để hủy.', 'warn');
    } else if (res.status === 404) {
      toast('✗ Không hủy được: agent-api không tìm thấy workflow (hoặc chưa hỗ trợ hủy).', 'err');
    } else {
      toast(`✗ Hủy thất bại (HTTP ${res.status}) — thử lại sau.`, 'err');
    }
  } catch (e) {
    if (gen !== pollGen) return;
    toast(`✗ Không gửi được yêu cầu hủy: ${e.message}`, 'err');
  } finally {
    if (gen === pollGen) {
      cancelInFlight = false;
      renderCancelUi();
    }
  }
  if (gen === pollGen) pollNow();   // lấy trạng thái thật (cancelled / cancel_requested) ngay
}

function startDur() {
  stopDur();
  durTimer = setInterval(() => {
    const el = document.getElementById('dur-val');
    if (el && startTime) el.textContent = fmtDur(startTime, new Date());
  }, 1000);
}
function stopDur() {
  if (durTimer) { clearInterval(durTimer); durTimer = null; }
}

function fmtDur(from, to) {
  const s = Math.max(0, Math.floor((to - from) / 1000));
  const m = Math.floor(s / 60);
  return `${m}:${(s % 60).toString().padStart(2, '0')}`;
}

// Hôm nay → chỉ giờ (như trước); ngày khác → ngày + giờ:phút. Trước đây chỉ có giờ nên các
// mục Recent khác ngày trông y hệt nhau. `now` là tham số để test không phụ thuộc đồng hồ.
function fmtTime(iso, now = new Date()) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString();
  return d.toLocaleString(undefined, {
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
  });
}

// Thời điểm đầy đủ (ngày + giờ:phút:giây) cho tooltip
function fmtFullTime(iso) {
  const d = new Date(iso);
  return iso && !isNaN(d.getTime()) ? d.toLocaleString() : '';
}

// FNV-1a 32-bit — chữ ký rẻ cho nội dung (output vài chục KB: dưới 1 ms mỗi lần poll)
function hashStr(s) {
  s = String(s);
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(36);
}

// Chữ ký danh sách file artifact: tên + kích thước (nối chuỗi — không cần nội dung file)
function artifactSig(files) {
  return (files || []).map(f => f.filename + ':' + f.size).join('\n');
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// URL ?id=<workflow_id> ↔ workflow đang theo dõi. Mỗi lần theo dõi một workflow KHÁC → một
// mục history (Back quay lại workflow trước, xem onPopState). URL không đổi (tải trang với
// ?id=, bấm Track lại cùng id, chọn chip Recent của workflow đang mở) → không push mục trùng.
function pushUrl(id) {
  const u = new URL(window.location);
  u.searchParams.set('id', id);
  if (u.href === String(window.location.href)) return;
  window.history.pushState({ id }, '', u);
}

// Back / Forward: trước đây pushState đổi URL nhưng không ai nghe popstate → URL đổi còn
// giao diện đứng yên (vẫn poll workflow cũ). Chỉ dựa vào ?id= của URL mới.
function onPopState() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) {
    // Về trang ban đầu (không có ?id=) → ngừng theo dõi, hiện màn hình trống
    stopAll();
    currentId = null;
    lastData  = null;
    document.getElementById('wid-input').value = '';
    document.getElementById('copy-btn').style.display = 'none';
    showView('empty');
    return;
  }
  // Cùng workflow đang hiển thị (vd. Back qua mục #anchor của link trong output) → giữ
  // nguyên tab + vị trí cuộn, không tải lại.
  if (id === currentId && currentView === 'wf') return;
  document.getElementById('wid-input').value = id;
  trackWorkflow(id, { push: false });
}

async function copyId() {
  if (!currentId) return;
  const id = currentId;
  if (await copyText(id)) toast('✓ Đã sao chép Workflow ID', 'ok');
  else toast('✗ Không sao chép được — Workflow ID: ' + id, 'err');
}

/* ── Artifacts / File tree ──────────────────────────────────────────── */

async function loadArtifacts(wid) {
  if (!wid) return;
  const gen = pollGen;
  try {
    const res = await fetch(`/workflow/${encodeURIComponent(wid)}/artifacts`, { signal: pollAbort?.signal });
    if (gen !== pollGen || !res.ok) return;
    const data = await res.json();
    // Đã chuyển sang workflow khác trong lúc chờ → không ghi đè cache bằng file của workflow cũ
    if (gen !== pollGen) return;
    artifactsCache = data.artifacts || {};
    // Render lại tab body — chữ ký _bodyKey (tên + kích thước file) quyết định có rebuild hay
    // không, kể cả khi artifact của tab hiện tại vừa bị xóa hoặc đổi nội dung.
    if (lastData && activeTab) renderTabBody(lastData);
  } catch (e) { /* non-fatal */ }
}

function switchSubTab(which) {
  subTabState[activeTab] = which;   // persist selection for this role
  const out    = document.getElementById('sub-output');
  const files  = document.getElementById('sub-files');
  const btnOut = document.getElementById('stb-output');
  const btnFil = document.getElementById('stb-files');
  if (!out || !files) return;
  if (which === 'output') {
    out.style.display = ''; files.style.display = 'none';
    if (btnOut) btnOut.classList.add('active');
    if (btnFil) btnFil.classList.remove('active');
  } else {
    out.style.display = 'none'; files.style.display = '';
    if (btnOut) btnOut.classList.remove('active');
    if (btnFil) btnFil.classList.add('active');
  }
}

function renderFileTree(role, files) {
  if (!files || !files.length) {
    return '<p style="color:var(--muted);padding:20px">Không có file artifact nào.</p>';
  }
  // Nhóm file theo thư mục cha
  const byDir = {};
  for (const f of files) {
    const parts = f.filename.split('/');
    const dir   = parts.length > 1 ? parts.slice(0, -1).join('/') : '';
    if (!byDir[dir]) byDir[dir] = [];
    byDir[dir].push(f);
  }
  const wid = encodeURIComponent(currentId);
  let html = `<div class="art-header">
    <button class="btn btn-secondary btn-sm" onclick="downloadRoleZip('${role}')">⬇ Download All</button>
  </div><div class="file-tree">`;
  for (const [dir, dirFiles] of Object.entries(byDir).sort()) {
    if (dir) html += `<span class="ft-dir-label">📂 ${esc(dir)}/</span>`;
    for (const f of dirFiles) {
      const icon  = getFileIcon(f.filename);
      const fname = f.filename.split('/').pop();
      const encPath = encodeURIComponent(f.filename);
      // Truyền role/path qua data-* (esc cho ngữ cảnh attribute) thay vì nhét vào chuỗi JS
      // trong onclick — tên file chứa \ hoặc ' không thể thoát khỏi chuỗi JS.
      html += `<div class="ft-item" data-role="${esc(role)}" data-path="${esc(f.filename)}"
           onclick="viewArtifact(this.dataset.role, this.dataset.path)">
        <span class="ft-icon">${icon}</span>
        <span class="ft-name">${esc(fname)}</span>
        <span class="ft-size">${fmtSize(f.size)}</span>
        <a class="btn btn-secondary btn-sm ft-dl"
           href="/workflow/${wid}/artifacts/${role}/${encPath}?download=1"
           download="${esc(fname)}"
           onclick="event.stopPropagation()">⬇</a>
      </div>`;
    }
  }
  html += `</div><div id="art-viewer" class="art-viewer" style="display:none"></div>`;
  return html;
}

async function viewArtifact(role, path) {
  const gen = pollGen;
  try {
    const wid     = encodeURIComponent(currentId);
    const encPath = encodeURIComponent(path);
    const res = await fetch(`/workflow/${wid}/artifacts/${role}/${encPath}`);
    if (!res.ok) return;
    const data = await res.json();
    // Đã đổi workflow hoặc đổi tab trong lúc chờ → không hiện file cũ vào viewer mới
    if (gen !== pollGen || role !== activeTab) return;
    const viewer = document.getElementById('art-viewer');
    if (!viewer) return;
    viewer.style.display = '';
    const lang    = data.language || 'text';
    const fname   = path.split('/').pop();
    const escaped = esc(data.content);
    viewer.innerHTML = `
      <div class="art-viewer-header">
        <span class="art-viewer-path">📄 ${esc(path)}</span>
        <button type="button" class="btn btn-secondary btn-sm js-copy-code" aria-label="Sao chép nội dung file">Copy</button>
        <a class="btn btn-secondary btn-sm"
           href="/workflow/${wid}/artifacts/${role}/${encPath}?download=1"
           download="${esc(fname)}">⬇ Download</a>
        <button class="btn btn-secondary btn-sm" onclick="closeArtViewer()" aria-label="Đóng">✕</button>
      </div>
      <pre class="art-viewer-body"><code class="language-${esc(lang)}">${escaped}</code></pre>`;
    highlightCode(viewer);   // lười như output; ngôn ngữ artifact (tf, conf, txt…) qua HL_ALIASES
    const _reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    viewer.scrollIntoView({ behavior: _reduce ? 'auto' : 'smooth', block: 'nearest' });
  } catch (e) { /* ignore */ }
}

function closeArtViewer() {
  const v = document.getElementById('art-viewer');
  if (v) v.style.display = 'none';
}

// JSZip (~100 KB) chỉ cần khi bấm "Download All" → nạp lười đúng một lần (các lần bấm
// sau dùng chung Promise). Nạp lỗi → gỡ thẻ script hỏng + xóa cache để lần bấm sau thử lại.
function loadJSZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  if (!jszipLoading) {
    const s = document.createElement('script');
    s.src = '/ui/static/vendor/jszip-3.10.2.min.js';
    jszipLoading = new Promise((resolve, reject) => {
      s.onload  = () => window.JSZip ? resolve(window.JSZip) : reject(new Error('JSZip không khởi tạo được'));
      s.onerror = () => reject(new Error('Không tải được JSZip'));
      document.head.appendChild(s);
    }).catch(e => {
      s.remove();
      jszipLoading = null;
      throw e;
    });
  }
  return jszipLoading;
}

async function downloadRoleZip(role) {
  const files = (artifactsCache[role] || []).filter(f => !f.filename.startsWith('_'));
  const wid   = encodeURIComponent(currentId);   // chốt id: đổi workflow giữa chừng không trộn file
  if (!files.length) { toast('Không có file để tải.', 'warn'); return; }

  let JSZipLib;
  try { JSZipLib = await loadJSZip(); }
  catch (e) { toast(`✗ ${e.message} — thử lại sau.`, 'err'); return; }
  toast(`⏳ Đang nén ${files.length} file…`);

  try {
    const zip    = new JSZipLib();
    const folder = zip.folder(role);
    let missing  = 0;   // file không tải được (404 / mạng) — báo thay vì im lặng bỏ qua
    await Promise.all(files.map(async f => {
      try {
        const r = await fetch(`/workflow/${wid}/artifacts/${role}/${encodeURIComponent(f.filename)}`);
        if (!r.ok) { missing++; return; }
        const d = await r.json();
        folder.file(f.filename, d.content);
      } catch (e) { missing++; }
    }));
    if (missing === files.length) { toast('✗ Không tải được file nào — thử lại sau.', 'err'); return; }
    const blob = await zip.generateAsync({ type: 'blob' });
    const url  = URL.createObjectURL(blob);
    // Anchor phải nằm trong DOM thì click() mới chắc chắn tải được (Firefox); thu hồi object
    // URL sau một nhịp — revoke ngay sau click() có thể hủy tải trước khi trình duyệt đọc blob.
    const a    = document.createElement('a');
    a.href = url; a.download = `${role}-artifacts.zip`; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    if (missing) toast(`⚠ Đã tải ${role}-artifacts.zip — thiếu ${missing}/${files.length} file không tải được.`, 'warn');
    else toast(`✓ Đã tải ${role}-artifacts.zip`, 'ok');
  } catch (e) { toast(`✗ Lỗi: ${e.message}`, 'err'); }
}

function getFileIcon(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  if (filename === 'Dockerfile' || filename.endsWith('dockerfile')) return '🐳';
  const m = {
    ts:'🔷',tsx:'🔷',js:'🟡',jsx:'🟡',py:'🐍',sql:'🗄️',
    md:'📝',yml:'⚙️',yaml:'⚙️',json:'{ }',sh:'🖥️',
    dart:'🎯',kt:'🤖',swift:'🍎',go:'🐹',rs:'🦀',
    html:'🌐',css:'🎨',scss:'🎨',tf:'☁️',
    java:'☕',toml:'⚙️',xml:'📋',env:'🔑',
  };
  return m[ext] || '📄';
}

function fmtSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}
